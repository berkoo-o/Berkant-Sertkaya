<script type="module">
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';

import {LineGeometry} from 'three/addons/lines/LineGeometry.js';
await Promise.all(['500 20px Poppins','600 30px Poppins','700 96px Poppins'].map(f=>document.fonts.load(f)));
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(28,W/H,0.05,200);

// ---------- palette (schraffuren look: navy bodies, purple fills, light outlines, white paths, orange highlight; red = function. thread)
const NAVY=0x1c1858,NAVY_D=0x141042,PURPLE=0x5a35c8,PURPLE_D=0x34248f,PURPLE_L=0x8d6dff,OUT=0xa992ff,LAV=0xdcd3ff,ORANGE=0xff7a2f,WHITE=0xffffff,RED=0xE01E2B;
const grad=new THREE.DataTexture(new Uint8Array([105,150,205,255]),4,1,THREE.RedFormat);grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const _tm={};const toon=c=>_tm[c]||(_tm[c]=new THREE.MeshToonMaterial({color:c,gradientMap:grad,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
const _bm={};const flat=(c,o=1)=>_bm[c+'_'+o]||(_bm[c+'_'+o]=new THREE.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,depthWrite:o>=1,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
const _lm={};const lineMat=(c,w)=>{const k=c+'_'+w;if(!_lm[k]){_lm[k]=new LineMaterial({color:c,linewidth:w});_lm[k].resolution.set(W,H);}return _lm[k];};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,u)=>a+(b-a)*u,ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};

// ---------- lights
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const dl=new THREE.DirectionalLight(0xffffff,2.6);dl.position.set(-2,3,6);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
Object.assign(dl.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:20});dl.shadow.radius=5;dl.shadow.bias=-0.0005;scene.add(dl,dl.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({color:0x12003a,opacity:.42}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ---------- helpers
function outline(mesh,color=OUT,w=3,thr=30){const e=new THREE.EdgesGeometry(mesh.geometry,thr);const g=new LineSegmentsGeometry().setPositions(e.attributes.position.array);const l=new LineSegments2(g,lineMat(color,w));mesh.add(l);return l;}
function box(par,w,h,d,color,x,y,z,ol=true,w_=3){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),toon(color));m.position.set(x,y,z);m.castShadow=true;par.add(m);if(ol)outline(m,OUT,w_);return m;}
function cyl(par,r,len,color,x,y,z,ol=true){const g=new THREE.CylinderGeometry(r,r,len,40);g.rotateZ(Math.PI/2);const m=new THREE.Mesh(g,toon(color));m.position.set(x,y,z);m.castShadow=true;par.add(m);if(ol)outline(m,OUT,3,40);return m;}
function line(par,pts,color=WHITE,w=5){const g=new LineGeometry().setPositions(pts.flat());const l=new Line2(g,lineMat(color,w));par.add(l);return l;}
function rrectPts(w,h,r,n=8){const p=[];const c=[[w/2-r,h/2-r,0],[-w/2+r,h/2-r,90],[-w/2+r,-h/2+r,180],[w/2-r,-h/2+r,270]];
  for(const [cx,cy,a0] of c)for(let i=0;i<=n;i++){const a=(a0+90*i/n)*Math.PI/180;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a),0]);}p.push(p[0]);return p;}
function panel(par,w,h,color,x,y,z,r=0.02,ol=OUT,lw=3,op=1){const s=new THREE.Shape();const pts=rrectPts(w,h,r);s.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>s.lineTo(p[0],p[1]));
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s),flat(color,op));m.position.set(x,y,z);par.add(m);if(ol!==null){const l=line(m,pts,ol,lw);l.position.z=0.001;}return m;}
// rounded polyline in the (z,y) plane -> array of [x,y,z]
function roundPath(P,r,x=0,seg=8){const out=[];for(let i=0;i<P.length;i++){const p=P[i];if(i===0||i===P.length-1){out.push([x,p[1],p[0]]);continue;}
    const a=P[i-1],b=P[i+1];const d1=[a[0]-p[0],a[1]-p[1]],d2=[b[0]-p[0],b[1]-p[1]];const l1=Math.hypot(...d1),l2=Math.hypot(...d2);const rr=Math.min(r,l1/2,l2/2);
    const s=[p[0]+d1[0]/l1*rr,p[1]+d1[1]/l1*rr],e=[p[0]+d2[0]/l2*rr,p[1]+d2[1]/l2*rr];
    for(let k=0;k<=seg;k++){const u=k/seg;const z=(1-u)**2*s[0]+2*(1-u)*u*p[0]+u*u*e[0],y=(1-u)**2*s[1]+2*(1-u)*u*p[1]+u*u*e[1];out.push([x,y,z]);}}return out;}
// note texture + ribbon (banknote following a path in the z-y plane, width along x)
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const noteTex=canvasTex(512,256,(g,w,h)=>{g.fillStyle='#8d6dff';g.fillRect(0,0,w,h);g.strokeStyle='#b9a6ff';g.lineWidth=8;g.strokeRect(26,26,w-52,h-52);
  g.fillStyle='#b9a6ff';g.beginPath();g.ellipse(w/2,h/2,70,56,0,0,7);g.fill();g.fillStyle='#8d6dff';g.beginPath();g.ellipse(w/2,h/2,34,28,0,0,7);g.fill();
  g.fillStyle='#b9a6ff';for(const [x,y] of [[70,64],[w-70,h-64]]){g.beginPath();g.arc(x,y,18,0,7);g.fill();}});
const noteMat=new THREE.MeshBasicMaterial({map:noteTex,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
function ribbon(par,pts,width,x0=0){const n=pts.length,pos=[],uv=[],idx=[];let L=0;const cum=[0];for(let i=1;i<n;i++){L+=Math.hypot(pts[i][2]-pts[i-1][2],pts[i][1]-pts[i-1][1]);cum.push(L);}
  for(let i=0;i<n;i++){pos.push(x0-width/2,pts[i][1],pts[i][2],x0+width/2,pts[i][1],pts[i][2]);uv.push(cum[i]/L,0,cum[i]/L,1);}
  for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const m=new THREE.Mesh(g,noteMat);m.castShadow=true;par.add(m);
  const e1=pts.map(p=>[x0-width/2,p[1],p[2]]),e2=pts.map(p=>[x0+width/2,p[1],p[2]]);
  line(m,[...e1,...e2.slice().reverse(),e1[0]],0xd6caff,3);return m;}

// =================================================================== ATM (exterior)
const BW=1.0,BH=1.15,BD=0.8; // base cabinet
const HEAD=[[-0.4,BH],[0.4,BH],[0.4,1.36],[0.14,2.0],[0.14,2.16],[-0.4,2.16]]; // side profile (z,y)
function headGeo(){const s=new THREE.Shape();s.moveTo(HEAD[0][0],HEAD[0][1]);HEAD.slice(1).forEach(p=>s.lineTo(p[0],p[1]));const g=new THREE.ExtrudeGeometry(s,{depth:BW,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(BW/2,0,0);return g;}
const atm=new THREE.Group();scene.add(atm);
{box(atm,BW,BH,BD,NAVY,0,BH/2,0);
 const head=new THREE.Mesh(headGeo(),toon(NAVY));head.castShadow=true;atm.add(head);outline(head);
 panel(atm,0.8,0.86,PURPLE_D,0,0.55,BD/2+0.002,0.04);
 // cash shutter on the front lip
 panel(atm,0.66,0.1,NAVY_D,0,1.255,0.402,0.02);panel(atm,0.56,0.035,0x0b0828,0,1.255,0.404,0.012,null);
 // header strip
 panel(atm,0.86,0.1,PURPLE,0,2.08,0.142,0.02);
 // sloped fascia
 const a=Math.atan2(0.26,0.64);const fa=new THREE.Group();fa.position.set(0,1.68,0.27);fa.rotation.x=-a;atm.add(fa);atm.userData.fascia=fa;
 panel(fa,0.9,0.62,PURPLE_D,0,0,0.002,0.03);
 panel(fa,0.46,0.3,NAVY_D,-0.04,0.13,0.004,0.02);const scr=panel(fa,0.38,0.23,LAV,-0.04,0.13,0.006,0.012,null);atm.userData.screen=scr;
 for(const s of [-1,1])for(let i=0;i<3;i++)panel(fa,0.05,0.035,PURPLE_L,-0.04+s*0.3,0.2-i*0.07,0.005,0.008,null);
 // keypad 4x3 + function keys (red / yellow / green)
 for(let r=0;r<4;r++)for(let c=0;c<3;c++)box(fa,0.052,0.036,0.012,PURPLE_L,-0.3+c*0.064,-0.1-r*0.048,0.008,false);
 const fk=[RED,0xf2c230,0x3bd16f];for(let r=0;r<3;r++){const k=box(fa,0.07,0.036,0.012,fk[r],-0.3+3*0.064+0.012,-0.1-r*0.048,0.008,false);if(r===0)atm.userData.redKey=k;}
 // card reader with the red card (function. thread)
 panel(fa,0.26,0.13,NAVY_D,0.25,-0.16,0.004,0.02);panel(fa,0.2,0.022,0x0b0828,0.25,-0.17,0.006,0.008,null);panel(fa,0.2,0.012,0x3bd16f,0.25,-0.125,0.006,0.005,null);
 const card=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.008,0.16),toon(RED));card.position.set(0.25,-0.17,0.075);card.castShadow=true;fa.add(card);outline(card,0xff8a92,2);atm.userData.card=card;
}

// =================================================================== CUTAWAY (inside)
const cut=new THREE.Group();scene.add(cut);
const CY=[0.17,0.405,0.64,0.875];const PZ=-0.33,TOPY=1.25;
{// housing: outline + faint fill
 const b=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,BD),flat(NAVY,0.22));b.position.y=BH/2;cut.add(b);outline(b,PURPLE_L,2);
 const h=new THREE.Mesh(headGeo(),flat(NAVY,0.22));cut.add(h);outline(h,PURPLE_L,2);
 // safe (thick frame lines)
 const sf=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.04,0.72),flat(NAVY_D,0.0));sf.position.set(0,0.56,-0.01);cut.add(sf);outline(sf,OUT,4);
 // cassettes: tray + note stack
 CY.forEach((y,i)=>{box(cut,0.74,0.11,0.44,PURPLE_D,0,y,0.06);const st=box(cut,0.66,0.05,0.38,PURPLE_L,0,y+0.08,0.06,true,2);
   box(cut,0.2,0.03,0.02,OUT,0,y,0.29,false); // handle
   cyl(cut,0.034,0.5,NAVY,0,y+0.14,-0.2);});
 // pick rollers pairs beside the vertical path
 CY.forEach(y=>{cyl(cut,0.03,0.5,PURPLE,0,y+0.19,PZ+0.045);cyl(cut,0.03,0.5,PURPLE,0,y+0.19,PZ-0.045);});
 // transport path: every cassette feeds the vertical line, then forward to the shutter
 CY.forEach(y=>line(cut,roundPath([[-0.12,y+0.118],[PZ,y+0.118],[PZ,y+0.2]],0.05,0.26),WHITE,7));
 line(cut,roundPath([[PZ,CY[0]+0.18],[PZ,TOPY],[0.4,TOPY]],0.07,0.26),WHITE,8);
 for(const z of [-0.12,0.2]){cyl(cut,0.03,0.5,PURPLE,0,TOPY+0.036,z);cyl(cut,0.03,0.5,PURPLE,0,TOPY-0.036,z);}
 // thickness sensor (orange)
 const s1=box(cut,0.56,0.03,0.03,ORANGE,0,TOPY+0.075,0.04,false),s2=box(cut,0.56,0.03,0.03,ORANGE,0,TOPY-0.075,0.04,false);
 line(cut,[[0.26,TOPY+0.06,0.04],[0.26,TOPY-0.06,0.04]],ORANGE,4);
 // reject box
 box(cut,0.5,0.1,0.16,PURPLE_D,0,1.07,-0.14,true,2);
 // screen + shutter hints
 const a=Math.atan2(0.26,0.64);const fa=new THREE.Group();fa.position.set(0,1.68,0.27);fa.rotation.x=-a;cut.add(fa);panel(fa,0.46,0.3,PURPLE_D,-0.04,0.13,0.004,0.02,OUT,2,0.7);
 panel(cut,0.66,0.1,NAVY_D,0,1.255,0.402,0.02,OUT,3,0.8);
 // a note on its way up + one leaving at the shutter
 const n1=ribbon(cut,roundPath([[PZ,0.72],[PZ,0.9]],0.01,0),0.36);cut.userData.note=n1;
}

// =================================================================== CLOSE-UP (rollers single out one note)
const clo=new THREE.Group();scene.add(clo);
{box(clo,1.25,0.12,1.2,NAVY,0,-0.4,0.45);                       // tray base
 box(clo,1.25,0.5,0.08,NAVY,0,-0.1,1.02);                         // tray end wall
 for(let i=0;i<9;i++)box(clo,0.86,0.05,0.8,i%2?PURPLE_L:0x9a7dff,0,-0.31+i*0.052,0.52,true,2); // note stack
 const r1=cyl(clo,0.3,0.95,NAVY,0,0.62,-0.38),r2=cyl(clo,0.3,0.95,NAVY,0,-0.0,-0.38);clo.userData.rollers=[r1,r2];
 for(const r of [r1,r2])for(const s of [-1,1]){const hub=cyl(r,0.1,0.04,0x8f8ab8,s*0.48,0,0,true);}
 // the note: off the stack, through the nip, out to the right
 const P=roundPath([[0.9,0.16],[0.12,0.16],[-0.1,0.31],[-0.62,0.31],[-1.25,0.52]],0.12,0);
 ribbon(clo,P,0.86);
 // thickness sensor bracket with orange beam
 box(clo,0.1,1.3,0.1,NAVY,-0.62,0.25,0.02);box(clo,0.95,0.09,0.1,NAVY,-0.19,0.86,0.02);
 box(clo,0.09,0.09,0.09,ORANGE,0.24,0.78,0.02,false);box(clo,0.09,0.06,0.09,ORANGE,0.24,-0.02,0.02,false);
 line(clo,[[0.24,0.74,0.02],[0.24,0.02,0.02]],ORANGE,5);
 // motion lines
 for(const [y,z,l] of [[1.02,-0.55,0.3],[0.96,-0.62,0.22],[-0.28,-0.75,0.3],[-0.35,-0.68,0.2]])line(clo,[[0.5,y,z],[0.5,y+l*0.25,z-l]],WHITE,4);
}

// =================================================================== shots (style stills)
const SH={
 A:{show:atm,pos:[-3.6,2.6,8.2],look:[0.0,1.08,0],fov:28,num:'48.000',small:'Geldautomaten stehen in Deutschland',sub:'Du steckst die Karte ein.',src:'Quelle: Deutsche Bundesbank, Zahlungsverkehrsstatistik (Stand Ende 2025)'},
 B:{show:cut,pos:[9.0,2.0,2.0],look:[0,1.0,0],fov:25,num:'4',small:'Kassetten voller Scheine stecken meist im Tresor',sub:'Unten im Tresor liegt das Geld.',src:'Quelle: Herstellerangaben, Patentschriften (EP 2 284 807)'},
 C:{show:clo,pos:[8.5,3.0,4.4],look:[0,0.45,-0.1],fov:27,num:'1',small:'Schein nach dem anderen – ein Sensor misst die Dicke',sub:'Gummiwalzen ziehen jeden Schein einzeln ab.',src:'Quelle: Patentschrift EP 2 284 807 (Mehrfachabzugssensor)'},
};
const numEl=document.getElementById('num'),subEl=document.getElementById('sub'),srcEl=document.getElementById('src');
function still(name){const s=SH[name];for(const g of [atm,cut,clo])g.visible=(g===s.show);
  cam.fov=s.fov;cam.position.set(...s.pos);cam.lookAt(...s.look);cam.updateProjectionMatrix();
  dl.position.set(s.look[0]-2,s.look[1]+3,s.look[2]+6);dl.target.position.set(...s.look);
  if(name!=='A'){dl.position.set(s.look[0]+5,s.look[1]+4,s.look[2]+3);ground.position.y=name==='C'?-0.46:0;}else ground.position.y=0;
  numEl.innerHTML=s.num+'<small>'+s.small+'</small>';subEl.textContent=s.sub;srcEl.textContent=s.src;
  renderer.render(scene,cam);}
const P=new URLSearchParams(location.search);
window.TOTAL=3;window.renderAt=async f=>{still('ABC'[f]||P.get('shot')||'A');return true;};
still(P.get('shot')||'A');
window.ready=true;
