  else{numEl.style.opacity=0;srcEl.style.opacity=0;}

}

// =================================================================== OUTRO overlay: the receipt prints the logo, the red card becomes the dot
const oc=document.getElementById('oc').getContext('2d');let LAY=null;
function layout(cx,base,sz){oc.font=`500 ${sz}px Poppins`;const all='function.'.split('');const ws=all.map(c=>oc.measureText(c).width);const tr=-0.04*sz;const tot=ws.reduce((a,b)=>a+b,0)+tr*8;let x=cx-tot/2;const xs=[];all.forEach((c,i)=>{xs.push(x);x+=ws[i]+tr;});
  const m=oc.measureText('.');return {xs,sz,base,dcx:xs[8]+(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2,dcy:base-(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2,dr:(m.actualBoundingBoxRight+m.actualBoundingBoxLeft)/2};}
function drawOutro(t){oc.clearRect(0,0,W,H);const o=t-O;if(o<0)return;
  const [sx,sy]=proj(...(()=>{const v=new THREE.Vector3(0.27,0.16,0.006);fa.localToWorld(v);return [v.x,v.y,v.z];})());
  const [s0]=proj(...(()=>{const v=new THREE.Vector3(0.27-0.095,0.16,0.006);fa.localToWorld(v);return [v.x,v.y,v.z];})());const PW=2*(sx-s0);            // paper width = slot width on screen
  if(!LAY)LAY=layout(sx,sy+250,PW*0.2);
  // soft darkening around
  const va=eo(o/0.6);const g=oc.createRadialGradient(sx,sy+200,PW*0.5,sx,sy+200,1300);g.addColorStop(0,'rgba(10,4,36,0)');g.addColorStop(1,`rgba(10,4,36,${0.6*va})`);oc.fillStyle=g;oc.fillRect(0,0,W,H);
  // paper feeds out of the slot in printer steps
  const steps=10,feed=clamp((o-0.35)/1.15,0,1);const st=Math.floor(feed*steps)/steps+ease((feed*steps)%1)/steps;const LEN=380*Math.min(1,st);
  if(LEN>1){oc.save();oc.beginPath();oc.rect(0,sy,W,H);oc.clip();const top=sy+LEN-380; // paper top edge (moves down with the feed)
    oc.shadowColor='rgba(10,4,36,.6)';oc.shadowBlur=30;oc.shadowOffsetY=10;oc.fillStyle='#f4f1ff';oc.beginPath();oc.moveTo(sx-PW/2,top);oc.lineTo(sx+PW/2,top);oc.lineTo(sx+PW/2,top+380);
    const zz=14;for(let i=0;i<zz;i++){const x1=sx+PW/2-(i+0.5)*PW/zz,x2=sx+PW/2-(i+1)*PW/zz;oc.lineTo(x1,top+380+12);oc.lineTo(x2,top+380);}oc.closePath();oc.fill();oc.shadowColor='transparent';
    // printed logo (moves with the paper)
    const dy=top+380-(sy+380);oc.font=`500 ${LAY.sz}px Poppins`;oc.fillStyle='#E01E2B';'function'.split('').forEach((c,i)=>oc.fillText(c,LAY.xs[i],LAY.base+dy));
    oc.fillStyle='rgba(52,36,143,.28)';for(let i=0;i<3;i++)oc.fillRect(sx-PW/2+40,LAY.base+dy+46+i*20,PW-80-(i===2?PW*0.3:0),6);
    oc.restore();

  const c0=proj(...(()=>{const v=new THREE.Vector3(0.27,-0.17,0.11);fa.localToWorld(v);return [v.x,v.y,v.z];})());const k=eio((o-1.25)/0.75);
  if(o>=1.25){const ex=LAY.dcx,ey=LAY.dcy;const cx=(c0[0]+ex)/2+260,cy=Math.min(c0[1],ey)-120;const q=k;const x=(1-q)**2*c0[0]+2*(1-q)*q*cx+q*q*ex,y=(1-q)**2*c0[1]+2*(1-q)*q*cy+q*q*ey;
    const w=lerp(PW*0.95,LAY.dr*2,q),h=lerp(PW*0.6,LAY.dr*2,q),r=lerp(14,LAY.dr,q);oc.save();oc.translate(x,y);oc.rotate((1-q)*-0.5+q*Math.PI*2);
    oc.shadowColor='rgba(224,30,43,.7)';oc.shadowBlur=lerp(26,8,q);oc.fillStyle='#E01E2B';oc.beginPath();oc.roundRect(-w/2,-h/2,w,h,r);oc.fill();
    if(q<0.6){oc.shadowColor='transparent';oc.globalAlpha=1-q/0.6;oc.fillStyle='#f2c230';oc.beginPath();oc.roundRect(-w*0.3,-h*0.1,w*0.2,h*0.3,4);oc.fill();}oc.restore();
    if(q>=1){const p=eo((o-2.0)/0.3);oc.save();oc.fillStyle='#E01E2B';oc.beginPath();oc.arc(ex,ey,LAY.dr*(1+0.35*(1-p)),0,7);oc.fill();oc.restore();}}
}

const PL_UP=new THREE.Plane(new THREE.Vector3(0,1,0),0),PL_DN=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
