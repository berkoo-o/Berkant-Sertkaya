// function. cover template — measured 1:1 from the BER cover (IMG_6433.png)
//  title line 1: white, left x=82, ascender top y=338, baseline y=441 (Poppins Bold)

await Promise.all(['500 100px Poppins','700 100px Poppins','600 30px Poppins'].map(f=>document.fonts.load(f)));

const P=new URLSearchParams(location.search);const L1=P.get('l1')||'Der',L2=P.get('l2')||'Geldautomat';
const bg=document.getElementById('bg').getContext('2d'),fg=document.getElementById('fg').getContext('2d');
// background: radial gradient + fine stars
{const g=bg.createRadialGradient(540,1000,0,540,1000,1250);g.addColorStop(0,'#1A1D23');g.addColorStop(1,'#0A0B0E');bg.fillStyle=g;bg.fillRect(0,0,W,H);
 let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<90;i++){const x=r()*W,y=r()*H;bg.globalAlpha=.18+r()*.4;bg.fillStyle='#9AA0AA';bg.beginPath();bg.arc(x,y,r()<.15?2.2:1.4,0,7);bg.fill();}bg.globalAlpha=1;}
// ring (lying ellipse on the ground)
const CX=540,CY=1248;
{bg.save();const g=bg.createRadialGradient(CX,CY,0,CX,CY,474);g.addColorStop(0,'rgba(224,30,43,0.10)');g.addColorStop(.7,'rgba(224,30,43,0.06)');g.addColorStop(1,'rgba(224,30,43,0.16)');
 bg.setTransform(1,0,0,100/474,0,CY-CY*100/474);bg.fillStyle=g;bg.beginPath();bg.arc(CX,CY,471,0,7);bg.fill();bg.restore();
 bg.save();bg.strokeStyle='#6E0F16';bg.lineWidth=2;bg.beginPath();bg.ellipse(CX,CY,523,111.5,0,0,7);bg.stroke();bg.restore();
 bg.save();bg.shadowColor='rgba(224,30,43,0.9)';bg.shadowBlur=28;bg.strokeStyle=RED;bg.lineWidth=7;bg.beginPath();bg.ellipse(CX,CY,471,96.5,0,0,7);bg.stroke();bg.stroke();bg.restore();}

// 3D parcel standing on the ring plane
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.style.position='absolute';document.body.insertBefore(renderer.domElement,document.getElementById('fg'));
const scene=new THREE.Scene();const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.5;
// camera elevation ~12° (ring ratio 100/474)
const D=10.2,el=20*Math.PI/180,az=0.0;const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
cam.position.set(D*Math.cos(el)*Math.sin(az),D*Math.sin(el),D*Math.cos(el)*Math.cos(az));cam.lookAt(0,0,0);cam.updateMatrixWorld();
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x1a0a0a,0.6));
const key=new THREE.DirectionalLight(0xfff4e6,2.6);key.position.set(-3,5,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=6;scene.add(key);
const rim=new THREE.DirectionalLight(0xff4050,1.4);rim.position.set(3,1.5,-3);scene.add(rim);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.1,...o});
const gp=new THREE.Group();scene.add(gp);gp.rotation.y=-0.5;gp.scale.setScalar(0.64);
const BODY=M(0x565bb0),PAN=M(0x2c2670),KEY=M(0x9a7dff),DARK=M(0x0f0c30),SCR=new THREE.MeshStandardMaterial({color:0xdcd3ff,emissive:0xb9a6ff,emissiveIntensity:.9,roughness:.3});
const bx=(par,w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;par.add(o);return o;};
bx(gp,1.0,1.15,0.8,BODY,0,0.575,0);
{const P=[[-0.4,1.15],[0.4,1.15],[0.4,1.36],[0.14,2.0],[0.14,2.16],[-0.4,2.16]];const sh=new THREE.Shape();sh.moveTo(P[0][0],P[0][1]);P.slice(1).forEach(p=>sh.lineTo(p[0],p[1]));
 const g=new THREE.ExtrudeGeometry(sh,{depth:1.0,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(0.5,0,0);const hd=new THREE.Mesh(g,BODY);hd.castShadow=true;gp.add(hd);}
bx(gp,0.8,0.86,0.01,PAN,0,0.55,0.402);bx(gp,0.66,0.1,0.01,PAN,0,1.255,0.402);bx(gp,0.56,0.035,0.012,DARK,0,1.255,0.404);bx(gp,0.86,0.1,0.01,M(0x7a55e8),0,2.08,0.142);
const FA=Math.atan2(0.26,0.64);const fa=new THREE.Group();fa.position.set(0,1.68,0.27);fa.rotation.x=-FA;gp.add(fa);
bx(fa,0.9,0.62,0.006,PAN,0,0,0.002);bx(fa,0.46,0.3,0.006,DARK,-0.14,0.13,0.005);bx(fa,0.38,0.23,0.006,SCR,-0.14,0.13,0.008);
for(let i=0;i<3;i++)bx(fa,0.05,0.035,0.008,KEY,-0.41,0.2-i*0.07,0.006);
for(let r=0;r<4;r++)for(let c=0;c<3;c++)bx(fa,0.052,0.036,0.014,KEY,-0.33+c*0.064,-0.1-r*0.048,0.008);
[0xE01E2B,0xf2c230,0x3bd16f].forEach((c,r)=>bx(fa,0.07,0.036,0.014,M(c),-0.33+3*0.064+0.012,-0.1-r*0.048,0.008));
bx(fa,0.24,0.09,0.006,DARK,0.27,0.16,0.005);bx(fa,0.26,0.13,0.006,DARK,0.27,-0.16,0.005);bx(fa,0.2,0.012,0.006,new THREE.MeshStandardMaterial({color:0x3bd16f,emissive:0x3bd16f,emissiveIntensity:.8}),0.27,-0.125,0.008);
bx(fa,0.19,0.01,0.2,new THREE.MeshStandardMaterial({color:0xE01E2B,roughness:.3,emissive:0x400000}),0.27,-0.17,0.1);
const sh=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.ShadowMaterial({opacity:.5}));sh.rotation.x=-Math.PI/2;sh.receiveShadow=true;scene.add(sh);
// put ground origin exactly on the ring centre (540,1248)
const o=new THREE.Vector3(0,0,0).project(cam);const ox=(o.x+1)/2*W,oy=(1-o.y)/2*H;cam.setViewOffset(W,H,ox-CX,oy-CY,W,H);
renderer.render(scene,cam);

// title + bar + logo, sizes calibrated to the measured template glyph heights
function calib(weight,ch,target,useCap){fg.font=`${weight} 100px Poppins`;const m=fg.measureText(ch);return 100*target/m.actualBoundingBoxAscent;}
const s1=calib(700,'l',441-338)*0.951,s2_=calib(700,'B',639-506)*1.015;
fg.fillStyle='#FFFFFF';fg.font=`700 ${s1}px Poppins`;{const m=fg.measureText(L1);fg.fillText(L1,82-m.actualBoundingBoxLeft*-1+0,441);}
fg.fillStyle=RED;fg.font=`700 ${s2_}px Poppins`;{let m=fg.measureText(L2);let z=s2_;if(m.width>900){z=s2_*900/m.width;fg.font=`700 ${z}px Poppins`;m=fg.measureText(L2);}fg.fillText(L2,82+m.actualBoundingBoxLeft,639);}
fg.fillStyle=RED;fg.beginPath();fg.roundRect(80,706,160,8,4);fg.fill();
// logo: Poppins 500, size from f-height (1641-1548), tracking solved so total ink width = 454 px, centred
{const sz=calib(500,'f',1641-1548);fg.font=`500 ${sz}px Poppins`;const s='function.';const ws=[...s].map(c=>fg.measureText(c).width);
 const mF=fg.measureText('f'),mD=fg.measureText('.');const base=ws.reduce((a,b)=>a+b,0);
 const ink0=base-ws[8]+(mD.actualBoundingBoxRight)+(mF.actualBoundingBoxLeft);const tr=(454-ink0)/8;
 let x=311+mF.actualBoundingBoxLeft;fg.fillStyle=RED;[...s].forEach((c,i)=>{fg.fillText(c,x,1641);x+=ws[i]+tr;});}
window.ready=true;
</script></body></html>
