function useSet(n){if(activeSet===n)return;for(const k in SETS)SETS[k].visible=(k===n);activeSet=n;}

function updateHall(t,lineT){

  pA.forEach(p=>{p.g.position.set(-12+p.off+travel,BELT_Y,0);p.g.rotation.y=p.rot;});

    const len=tA.distanceTo(tB);b.scale.set(1,len,1);b.position.copy(tA).add(tB).multiplyScalar(.5);b.quaternion.setFromUnitVectors(up,tB.clone().sub(tA).normalize());});

  const hT=trays[HT];const tt=t-T_TILT;

  pS.forEach(p=>{const tx=trayX(p.i,t);
    if(!p.hero){p.g.position.set(tx,TRAY_Y,0);p.g.rotation.set(0,0,0);return;}
    const ts=tt-0.22;let s=0,xv=tx;
    if(ts>0){const a=2.4,vmax=1.9,tAcc=vmax/a;s=ts<tAcc?0.5*a*ts*ts:0.5*a*tAcc*tAcc+vmax*(ts-tAcc);
      const sEnd=CH0/Math.cos(TILT)+CHL-0.2-0.05;if(s>sEnd-0.25){const over=s-(sEnd-0.25);s=sEnd-0.25*Math.exp(-over/0.25);}
      const xs=trayX(HT,T_TILT+0.22),k=1.6;xv=xs+TV*(1-Math.exp(-k*ts))/k;}
    const ang=ts>0?TILT:hT.piv.rotation.x;p.g.position.set(xv,TRAY_Y-Math.sin(ang)*s,Math.cos(ang)*s);p.g.rotation.set(ang,0,0);});
}

function setTime(t){
  let si=shots.findIndex(o=>t>=o.t0&&t<o.t1);if(si<0)si=shots.length-1;const sh=shots[si];const u=(t-sh.t0)/(sh.t1-sh.t0);

  const n=sh.name;

    cam.position.set(fx-1.35-u*0.45,BELT_Y+0.6+u*0.1,1.35+u*0.2);cam.lookAt(fx-0.2+u*0.2,BELT_Y+0.12,0.1);cam.fov=40;

    cam.position.set(hx-2.2,2.4,SZ+3.4);cam.lookAt(hx+0.6,1.0,SZ);cam.fov=40;

    cam.position.set(CHX+1.6-u*0.5,3.3-u*0.15,SZ+6.4-u*0.4);cam.lookAt(CHX+0.1,0.75,SZ+0.7);cam.fov=40;
    key.position.set(CHX-3,9,SZ+5);key.target.position.set(CHX,0,SZ);}
  else if(n==='wide'){updateHall(t,t);
    cam.position.set(9-u*1.5,5.6-u*0.4,SZ+7.5-u*0.6);cam.lookAt(-3-u*1.0,0.8,SZ+0.3);cam.fov=40;
    key.position.set(0,10,SZ+6);key.target.position.set(0,0,SZ);}
  else if(n==='truck'||n==='truck2'){
    scene.fog.density=0.022;key.intensity=0.6;key.color.set(0x9db4e0);hemi.intensity=0.3;
    const sp=n==='truck'?13:11;const x=n==='truck'?-22+sp*(t-sh.t0):-30+sp*(t-sh.t0);
    truck.position.set(x,0,-1.8);truck.rotation.y=0;spinWheels(truck,x);
    if(n==='truck'){cam.position.set(x+11-u*2,2.0,9.5);cam.lookAt(x+0.5,2.0,-1.8);cam.fov=42;}
    else{cam.position.set(14,1.1,1.6);cam.lookAt(x+2,1.9,-1.8);cam.fov=36;}
    key.position.set(x-10,20,15);key.target.position.set(x,0,0);}
  else if(n==='hub'){
    scene.fog.density=0.02;key.intensity=0.6;key.color.set(0x9db4e0);hemi.intensity=0.3;
    const k=ease(clamp((t-sh.t0)/2.6,0,1));const z=lerp(16,4.87,k);truckHub.position.set(0,0,z);spinWheels(truckHub,-z);
    cam.position.set(7-u*1.0,5.5-u*0.5,24-u*1.5);cam.lookAt(1.0,2.6,6);cam.fov=40;
    key.position.set(-10,20,25);key.target.position.set(0,0,5);}
  else if(n==='unload'){
    const off=(t*BELT_V);beltTex.offset.y=-off/1.0;
    pD.forEach(p=>{const z=-11.5+((p.off+off)%23);const vis=z<5.6;p.g.visible=vis&&z>-11.3;p.g.position.set(0,TB,z);});
    cam.position.set(0.7-u*0.1,TB+1.1,4.6-u*0.5);cam.lookAt(0,TB+0.2,-3);cam.fov=42;
    key.position.set(2,9,6);key.target.position.set(0,0,0);}
  else if(n==='depot'){
    cam.position.set(2.2-u*1.2,2.0,5.2-u*0.4);cam.lookAt(0,1.3,0);cam.fov=40;
    key.position.set(-2,8,5);key.target.position.set(0,0,0);}
  else if(n==='van'){
    scene.fog.density=0.025;key.intensity=0.6;key.color.set(0x9db4e0);hemi.intensity=0.35;
    const x=-10+7.0*(t-sh.t0);van.position.set(x,0,6.2);van.rotation.y=0;spinWheels(van,x*1.25);van.visible=true;
    cam.position.set(9.5,1.5,1.2);cam.lookAt(lerp(-2,5,u),1.4,5.5);cam.fov=42;
    key.position.set(-6,15,14);key.target.position.set(0,0,3);}
  else if(n==='door'){
    scene.fog.density=0.025;key.intensity=0.5;key.color.set(0x9db4e0);hemi.intensity=0.32;van.visible=false;
    cam.position.set(1.5-u*0.3,1.0-u*0.1,3.3-u*0.5);cam.lookAt(0.0,0.5,0.4);cam.fov=40;
    key.position.set(-6,15,14);key.target.position.set(0,0,3);}
  else if(n==='crane'){
    scene.fog.density=0.025;key.intensity=0.5;key.color.set(0x9db4e0);hemi.intensity=0.32;
    const x=4+6*(t-sh.t0);van.visible=true;van.position.set(x,0,6.2);van.rotation.y=0;spinWheels(van,x*1.25);
    const k=ease(u);cam.position.set(lerp(1.3,4.5,k),lerp(0.95,4.2,k),lerp(2.9,12.5,k));cam.lookAt(lerp(0,1,k),lerp(0.75,2.2,k),lerp(0.4,1,k));cam.fov=40;
    key.position.set(-6,15,14);key.target.position.set(0,0,3);}
  else if(n==='macro'){
    scene.fog.density=0.025;key.intensity=0.5;key.color.set(0x9db4e0);hemi.intensity=0.32;van.visible=false;
    const hd=heroDoor.userData;heroDoor.updateMatrixWorld();tA.copy(hd.lab.position);heroDoor.localToWorld(tA);
    const um=clamp((t-sh.t0)/(O-sh.t0),0,1),ko=ease((t-O)/3.0),pe=ease((t-55.7)/1.2);
    const tp=new THREE.Vector3(0,hd.h,0);heroDoor.localToWorld(tp);
    const p0=new THREE.Vector3(tA.x+0.12-um*0.03,tA.y+0.42-um*0.12,tA.z+0.28-um*0.08);
    const p1=new THREE.Vector3(tp.x+0.3,tp.y+0.8+ko*0.15,tp.z+1.05+ko*0.2);
    const l1=new THREE.Vector3(tp.x,tp.y+0.3,tp.z);
    cam.position.copy(p0.lerp(p1,pe));cam.lookAt(tA.clone().lerp(l1,pe));cam.fov=40;
    key.position.set(-6,15,14);key.target.position.set(0,0,3);}
  // laser sweep over hero label in macro shot
  macroLaser.visible=(n==='macro'&&t>54.4&&t<56.4);
  if(macroLaser.visible){const hd=heroDoor.userData;const k=(t-54.4)/2.0;macroLaser.position.set(-hd.w/2+0.02+hd.lw*(0.05+0.9*k),hd.h+0.006,hd.lab.position.z);}
  // only keep spot lights near the shot's focus (fixed per shot -> identical in every chunk)
  {const F={A:[-3,0,9],scan:[4,0,9],sortTrack:[-4,30,10],tilt:[0.2,30,9],wide:[-2,30,14]}[n]||[0,0,1e9];
   allSpots.forEach(sp=>{if(sp.parent!==SETS.hall)return;sp.visible=Math.hypot(sp.position.x-F[0],sp.position.z-F[1])<F[2];});}
  cam.updateProjectionMatrix();
  // overlay
  const s=subs.find(o=>t>=o[0]&&t<o[1]);subEl.innerHTML=s?s[2]:'';
  subEl.style.opacity=s?Math.min(1,(t-s[0])/0.15+0.2)*(t>O?clamp((O+0.35-t)/0.35,0,1):1):0;
  logoEl.style.opacity=1-eo((t-O)/0.35);
  heroDoor.userData.tapes.forEach(m=>m.visible=!(t>=O+0.3));
  const nm=nums.find(o=>t>=o[0]&&t<o[1]);
  if(nm){numEl.innerHTML=nm[2]+'<small>'+nm[3]+'</small><i></i>';const op=Math.min(clamp((t-nm[0])/0.35,0,1),clamp((nm[1]-t)/0.25,0,1));numEl.style.opacity=op;srcEl.textContent=nm[4];srcEl.style.opacity=op;}
  else{numEl.style.opacity=0;srcEl.style.opacity=0;}
  // cut dips + final fade
  const dIn=si===0?clamp(t/0.5,0,1):clamp((t-sh.t0)/0.2,0,1);const dOut=si===shots.length-1?1:clamp((sh.t1-t)/0.2,0,1);
  return Math.min(dIn,dOut);
}
const macroLaser=new THREE.Mesh(new THREE.PlaneGeometry(0.004,0.16),emis(0xff2a35));macroLaser.rotation.x=-Math.PI/2;heroDoor.add(macroLaser);

// =================================================================== OUTRO (styleguide 6b, themed: red parcel tape -> logo dot)
const logoEl=document.getElementById('logo');
const eo=x=>{x=clamp(x,0,1);return 1-(1-x)**3};const eio=x=>{x=clamp(x,0,1);return x<.5?4*x**3:1-(-2*x+2)**3/2};
const oc=document.getElementById('oc').getContext('2d');
const LETTERS='function'.split('');
let LAY=null;
function layout(){oc.font='500 170px Poppins';const all='function.'.split('');const ws=all.map(c=>oc.measureText(c).width);
  const tot=ws.reduce((a,b)=>a+b,0)-7*(all.length-1);let x=540-tot/2;const xs=[];all.forEach((c,i)=>{xs.push(x);x+=ws[i]-7;});
  const m=oc.measureText('.');const L=m.actualBoundingBoxLeft,Rr=m.actualBoundingBoxRight;
  const dcx=xs[8]+(Rr-L)/2,dcy=1010-(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2,dr=(Rr+L)/2;
  return {xs,ws,dcx,dcy,dr};}
const proj=v=>{const p=v.clone().project(cam);return [(p.x+1)/2*W,(1-p.y)/2*H];};
let SP=null;
const LOGOC=document.createElement('canvas');LOGOC.width=1080;LOGOC.height=1920;
function drawOutro(t){oc.clearRect(0,0,W,H);const o=t-O;if(o<0)return;if(!LAY)LAY=layout();
  // themed outro: the red parcel tape peels off, flies as a ribbon and writes the logo
  const va=eo(o/1.0);const g=oc.createRadialGradient(540,960,0,540,960,1150);g.addColorStop(0,`rgba(20,18,16,${.6*va})`);g.addColorStop(1,`rgba(8,7,6,${.95*va})`);oc.fillStyle=g;oc.fillRect(0,0,W,H);
  const hd=heroDoor.userData;
  const P3=(x,y,z)=>{const v=new THREE.Vector3(x,y,z);heroDoor.localToWorld(v);return proj(v);};
  // tape polyline on the parcel: back side -> top -> front side (front end = where the peel starts)
  const tape=[];const N=10;
  for(let k=0;k<=4;k++)tape.push(P3(0,hd.h*0.58+hd.h*0.42*k/4,-hd.d/2-0.002));
  for(let k=1;k<=N;k++)tape.push(P3(0,hd.h+0.002,-hd.d/2+hd.d*k/N));
  for(let k=1;k<=4;k++)tape.push(P3(0,hd.h-hd.h*0.42*k/4,hd.d/2+0.002));
  tape.reverse(); // index 0 = back bottom ... last = front bottom
  const tw0=clamp(Math.hypot(...(()=>{const a=P3(-hd.tw/2,hd.h,0),b=P3(hd.tw/2,hd.h,0);return [a[0]-b[0],a[1]-b[1]];})()),10,140);
  // flight: from front end of tape up and over into the logo start
  const [fx,fy]=tape[tape.length-1];const lx0=LAY.xs[0]-10,ly=968;
  const cxp=(fx+lx0)/2+260,cyp=Math.min(fy,ly)-420;const flight=[];
  for(let k=1;k<=40;k++){const q=k/40;flight.push([(1-q)**2*fx+2*(1-q)*q*cxp+q*q*lx0,(1-q)**2*fy+2*(1-q)*q*cyp+q*q*ly]);}
  // writing path: a wave through every letter of "function", then into the dot
  const write=[];const xe=LAY.dcx;
  for(let i=0;i<8;i++){const x0=LAY.xs[i],w=LAY.ws[i];for(let k=1;k<=10;k++){const q=k/10;write.push([x0+w*q,ly-10*Math.sin(q*2*Math.PI)]);}}
  write.push([xe,LAY.dcy]);
  const path=[...tape,...flight,...write];const cum=[0];for(let k=1;k<path.length;k++)cum.push(cum[k-1]+Math.hypot(path[k][0]-path[k-1][0],path[k][1]-path[k-1][1]));
  const sT=cum[tape.length-1],sF=cum[tape.length+flight.length-1],sE=cum[cum.length-1];
  const at=s=>{s=clamp(s,0,sE);let k=1;while(k<cum.length-1&&cum[k]<s)k++;const a=cum[k-1],b=cum[k],q=b>a?(s-a)/(b-a):0;return [lerp(path[k-1][0],path[k][0],q),lerp(path[k-1][1],path[k][1],q)];};
  // head / tail timing
  let head;if(o<0.3)head=sT;else if(o<0.95)head=lerp(sT,sF,eio((o-0.3)/0.65));else head=lerp(sF,sE,clamp((o-0.95)/1.05,0,1)**0.9);
  const Lw=lerp(120,0,clamp((o-0.95)/1.05,0,1));const Lmax=o<0.95?sT:Math.max(Lw,sT*(1-eio((o-0.95)/0.3)));const tail=Math.max(0,head-Lmax);
  // logo letters revealed behind the ribbon head
  const [hx,hy]=at(head);
  if(head>sF){const lc=LOGOC.getContext('2d');lc.globalCompositeOperation='source-over';lc.clearRect(0,0,W,H);lc.font='500 170px Poppins';lc.fillStyle='#E01E2B';
    LETTERS.forEach((ch,i)=>lc.fillText(ch,LAY.xs[i],1010));
    if(head<sE-1){const gr=lc.createLinearGradient(hx-110,0,hx-10,0);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');lc.globalCompositeOperation='destination-in';lc.fillStyle=gr;lc.fillRect(0,0,W,H);}
    oc.drawImage(LOGOC,0,0);}
  // the ribbon (tape) itself
  if(o>=0.3&&head-tail>1){const pts=[];const st=Math.max(4,(head-tail)/60);for(let s2=tail;s2<head;s2+=st)pts.push(at(s2));pts.push([hx,hy]);
    const wv=lerp(tw0,16,eio(clamp((o-0.3)/0.6,0,1)));
    oc.save();oc.lineJoin='round';oc.lineCap='butt';oc.shadowColor='rgba(224,30,43,.6)';oc.shadowBlur=18;
    oc.strokeStyle='#C8141F';oc.lineWidth=wv;oc.beginPath();pts.forEach((p,k)=>k?oc.lineTo(...p):oc.moveTo(...p));oc.stroke();
    oc.shadowBlur=0;oc.strokeStyle='#E01E2B';oc.lineWidth=wv*0.72;oc.stroke();
    oc.strokeStyle='rgba(255,140,140,.55)';oc.lineWidth=Math.max(1.5,wv*0.12);oc.stroke(); // glossy tape sheen
    oc.restore();}
  // the end of the tape becomes the dot
  const dk=eo((o-1.95)/0.35);if(dk>0){const sc=lerp(1.35,1,dk);oc.save();oc.globalAlpha=Math.min(1,dk*1.5);oc.shadowColor='#E01E2B';oc.shadowBlur=lerp(24,8,dk);oc.fillStyle='#E01E2B';oc.beginPath();oc.arc(LAY.dcx,LAY.dcy,LAY.dr*sc,0,7);oc.fill();oc.restore();}
}
// ---------- post
const rt=new THREE.WebGLRenderTarget(W,H,{samples:4,type:THREE.HalfFloatType});
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const post=new THREE.ShaderMaterial({uniforms:{tex:{value:rt.texture},seed:{value:0},fade:{value:1}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tex;uniform float seed,fade;varying vec2 v;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed)*43758.5453);}
 void main(){vec3 c=texture2D(tex,v).rgb*1.1;
  c=mix(c,c*vec3(.97,1.0,1.04),.8);
  c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
  vec2 q=v-.5;q.x*=.62;c*=mix(.5,1.,smoothstep(.8,.2,length(q)));
  c=pow(max(c,0.),vec3(1./2.2));
  c+=(h(v*vec2(1080.,1920.))-.5)*.012;
  gl_FragColor=vec4(c*fade,1.);}`});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
window.TOTAL=Math.round(END*30);

  renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);
  post.uniforms.seed.value=(f*7.13)%100;post.uniforms.fade.value=fade;
  renderer.render(postScene,postCam);drawOutro(f/30);return true;};
window.ready=true;
