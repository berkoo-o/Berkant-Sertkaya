<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0A0B0E}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// function. standard outro (from toolkit render.py: outro()) – red particles form the logo
(async()=>{
await document.fonts.load('500 170px Poppins');
const W=1080,H=1920,RED='#E01E2B';
const cv=document.getElementById('c').getContext('2d');
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>{x=cl(x);return 1-(1-x)**3},eio=x=>{x=cl(x);return x<.5?4*x**3:1-(-2*x+2)**3/2},lerp=(a,b,p)=>a+(b-a)*p;
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PARTS=[...Array(70)].map(()=>[R()*W,R()*H,1+R()*2,8+R()*18,R()]);
function tracked(ctx,s,x,y,sz,color,a,track){ctx.font=`500 ${sz}px Poppins`;const ws=[...s].map(ch=>ctx.measureText(ch).width);
  const tot=ws.reduce((p,q)=>p+q,0)+track*sz*(s.length-1);let xx=x-tot/2;ctx.fillStyle=color;ctx.globalAlpha=a;
  [...s].forEach((ch,i)=>{ctx.fillText(ch,xx,y);xx+=ws[i]+track*sz;});ctx.globalAlpha=1;return tot;}
// logo points: sample the rendered logo every 6 px (logo baseline y=1000)
const off=document.createElement('canvas');off.width=W;off.height=400;const oc=off.getContext('2d');
tracked(oc,'function.',540,250,170,'#f00',1,-.03);
const img=oc.getImageData(0,0,W,400).data;let pts=[];
for(let y=0;y<400;y+=6)for(let x=0;x<W;x+=6)if(img[(y*W+x)*4+3]>128)pts.push([x,y+1000-250]);
seed=3;for(let i=pts.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]];}
pts=pts.slice(0,240);
seed=5;const SRC=pts.map(()=>{const an=R()*2*Math.PI,r=280*Math.sqrt(R());return [540+r*Math.sin(an),860-r*Math.cos(an),R()*.5];});
function background(v){cv.globalAlpha=1;cv.fillStyle='#0A0B0E';cv.fillRect(0,0,W,H);
  const g=cv.createRadialGradient(540,820,0,540,820,1150);g.addColorStop(0,'#15171C');g.addColorStop(1,'#0A0B0E');cv.fillStyle=g;cv.fillRect(0,0,W,H);
  for(const [x,y,r,sp,ph] of PARTS){const yy=((y-v*sp)%H+H)%H,xx=x+14*Math.sin(v*.3+ph*6);cv.globalAlpha=.10+.08*Math.sin(v+ph*9);cv.fillStyle='#9AA0AA';cv.beginPath();cv.arc(xx,yy,r,0,7);cv.fill();}
  cv.globalAlpha=1;}
// soft red glow sprite (replaces blur 6 px)
const GLOW=document.createElement('canvas');GLOW.width=GLOW.height=32;{const g=GLOW.getContext('2d');const rg=g.createRadialGradient(16,16,0,16,16,16);rg.addColorStop(0,'rgba(224,30,43,1)');rg.addColorStop(.45,'rgba(224,30,43,.8)');rg.addColorStop(1,'rgba(224,30,43,0)');g.fillStyle=rg;g.fillRect(0,0,32,32);}
// timeline (seconds from outro start); original: start 71.5, logo 73.0, end 74.9
const S=0.0;
window.TOTAL=102;
window.renderAt=async(f)=>{const v=f/30;background(v);
  const la=eo((v-1.5)/.5);
  pts.forEach(([lx,ly],i)=>{const [sx,sy,d]=SRC[i];if(v<.05+d*.3)return;
    const p=eio((v-.1-d)/1.3);
    const mx=lerp(sx,lx,p)+120*Math.sin(p*Math.PI)*Math.cos(d*20),my=lerp(sy,ly,p)-160*Math.sin(p*Math.PI)*(d+.2);
    const a=eo((v-.05-d*.3)/.2)*(1-la);
    cv.globalAlpha=.35*a;cv.drawImage(GLOW,mx-16,my-16);
    cv.globalAlpha=a;cv.fillStyle='#FF6B74';cv.beginPath();cv.arc(mx,my,3.2,0,7);cv.fill();});
  cv.globalAlpha=1;
  if(la>0){const sc=lerp(1.06,1,eo((v-1.5)/.8));cv.save();cv.translate(540,940);cv.scale(sc,sc);cv.translate(-540,-940);
    tracked(cv,'function.',540,1000,170,RED,la,-.03);cv.restore();}
  // fade in from black (main video ends black) and fade out at the very end
  const fade=eo(v/.3);if(fade<1){cv.globalAlpha=1-fade;cv.fillStyle='#000';cv.fillRect(0,0,W,H);cv.globalAlpha=1;}
  return true;};
window.ready=true;
})();
</script></body></html>
