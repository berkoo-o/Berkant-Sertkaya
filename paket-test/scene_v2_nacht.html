<script type="module">
import * as THREE from 'three';
await Promise.all(['500 20px Poppins','600 30px Poppins','700 96px Poppins'].map(f=>document.fonts.load(f)));
const W=1080,H=1920;

const FOG=new THREE.Color(0x0b1016);

// ---------- helpers
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(12345);
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.1,...o});
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);

const PAL=[0x5b636c,0x646c75,0x575e66,0x6a7179];

function labelTex(seed,hero){
  const c=document.createElement('canvas');c.width=512;c.height=340;const g=c.getContext('2d');
  g.fillStyle='#f7f4ee';g.fillRect(0,0,512,340);
  g.fillStyle='#222';g.font='600 30px Poppins';g.fillText(hero?'AN: M. Muster':'AN: Kunde '+seed,28,52);
  g.font='500 24px Poppins';g.fillText('Beispielweg '+(seed%90+1),28,88);g.fillText((10115+seed*37)%99999+' Stadt',28,120);
  let x=28,r=(s=>()=>(s=(s*48271)%2147483647)/2147483647)(seed*99+7);
  g.fillStyle='#111';while(x<484){const w=2+Math.floor(r()*6);if(r()>.4)g.fillRect(x,150,w,130);x+=w+2;}
  g.font='500 20px Poppins';g.fillText('00340 4342 '+(1000+seed*13)%9999+' 21',28,310);
  if(hero){g.fillStyle='#E01E2B';g.fillRect(440,20,52,52);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
const kraftTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#b9895a';g.fillRect(0,0,256,256);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${rnd()>.5?90:230},${rnd()>.5?60:180},30,${rnd()*.08})`;g.fillRect(rnd()*256,rnd()*256,1+rnd()*3,1);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();

// parcel: size w(x) h(y) d(z); origin at bottom center
function makeParcel(w,h,d,seed,hero){
  const g=new THREE.Group();
  const tint=hero?0xfff2e2:[0xffe8d0,0xfff6ea,0xf2dcc4,0xffffff][seed%4];
  const box=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(tint,{map:kraftTex,roughness:.85}));
  box.position.y=h/2;box.castShadow=box.receiveShadow=true;g.add(box);
  const tapeC=hero?0xE01E2B:[0xd9c79b,0x8fb6d9,0xd9c79b,0xbfa77a][seed%4];
  const tm=mat(tapeC,{roughness:.35,metalness:0,emissive:hero?0x3a0000:0});
  const tape=new THREE.Mesh(new THREE.BoxGeometry(w+0.004,0.004,d*0.22),tm);tape.position.y=h+0.002;g.add(tape);
  const tape2=new THREE.Mesh(new THREE.BoxGeometry(0.004,h*0.5,d*0.22),tm);tape2.position.set(w/2+0.002,h*0.75,0);g.add(tape2);
  const tape3=tape2.clone();tape3.position.x=-w/2-0.002;g.add(tape3);
  const lw=Math.min(w*0.55,0.3),lh=lw*340/512;
  const lab=new THREE.Mesh(new THREE.PlaneGeometry(lw,lh),new THREE.MeshStandardMaterial({map:labelTex(seed,hero),roughness:.6}));
  lab.rotation.x=-Math.PI/2;lab.position.set(-w*0.18,h+0.006,d*0.12);g.add(lab);
  g.userData.label=lab;return g;
}

// ---------- hall (shared background)
const hall=new THREE.Group();scene.add(hall);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x16191d,{roughness:.4,metalness:.2}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;hall.add(floor);
// floor safety lines
for(const z of [-2.2,2.6]){const l=new THREE.Mesh(new THREE.PlaneGeometry(200,0.12),mat(0xF2C230,{roughness:.7}));l.rotation.x=-Math.PI/2;l.position.set(0,0.003,z);hall.add(l);}
// colored hall lights (bokeh)
for(let i=0;i<60;i++){const c=new THREE.Color(0xdde6ff);
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.12+rnd()*0.12,12,8),new THREE.MeshBasicMaterial({color:c,fog:true}));
  s.position.set(-30+rnd()*60,4+rnd()*5,-8-rnd()*25);hall.add(s);}
// pillars
for(let i=-6;i<=6;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.5,12,.5),mat(0x22272e,{roughness:.6,metalness:.4}));p.position.set(i*6,6,-9);p.castShadow=true;hall.add(p);}


const SZ=30;let CHX0;
// ---------- light cones (fake volumetrics)

  fragmentShader:'uniform float k;varying float vy;varying vec3 vn,vv;void main(){float e=pow(abs(dot(vn,vv)),1.5);gl_FragColor=vec4(vec3(.82,.88,1.)*k*vy*vy*e,1.);}'});
function addCone(p){const g=new THREE.CylinderGeometry(.3,2.4,p.y,32,1,true);const m=new THREE.Mesh(g,coneMat);m.position.set(p.x,p.y/2,p.z);scene.add(m);}
for(const [x,z] of [[0,-0.3],[3,0.2],[-3,0],[6,0],[CHX0=0.2,SZ+0.6],[-5,SZ+0.3],[5.5,SZ+0.3]]){
  const sp=new THREE.SpotLight(0xf6f4ee,22,14,0.42,0.6,1.6);sp.position.set(x,6.2,z);sp.target.position.set(x,0,z);scene.add(sp);scene.add(sp.target);
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,.12,20),new THREE.MeshBasicMaterial({color:0xf2f6ff}));lamp.position.set(x,6.2,z);scene.add(lamp);addCone(lamp.position);}

// ---------- SHOT A/B: roller conveyor + scanner arch
const lineA=new THREE.Group();scene.add(lineA);
const BELT_Y=0.85;
const frameM=mat(0x8a9099,{metalness:.75,roughness:.35});
for(const z of [-0.42,0.42]){const r=new THREE.Mesh(new THREE.BoxGeometry(40,0.14,0.06),frameM);r.position.set(0,BELT_Y-0.03,z);r.castShadow=true;lineA.add(r);}
for(let x=-20;x<=20;x+=2){for(const z of [-0.4,0.4]){const l=new THREE.Mesh(new THREE.BoxGeometry(.06,BELT_Y-0.1,.06),mat(0x2b2b30,{metalness:.5}));l.position.set(x,(BELT_Y-0.1)/2,z);lineA.add(l);}}
const rollers=[];const RR=0.035;
const rollerGeo=new THREE.CylinderGeometry(RR,RR,0.8,16);rollerGeo.rotateX(Math.PI/2);
const rollerM=mat(0xc8ccd2,{metalness:.85,roughness:.28});
for(let x=-20;x<=20;x+=0.11){const r=new THREE.Mesh(rollerGeo,rollerM);r.position.set(x,BELT_Y-RR,0);r.receiveShadow=true;lineA.add(r);rollers.push(r);}
// scanner arch at x=3
const arch=new THREE.Group();arch.position.x=3;lineA.add(arch);
const archM=mat(0x7a818a,{metalness:.7,roughness:.35});
const postL=new THREE.Mesh(new THREE.BoxGeometry(.3,1.6,.14),archM);postL.position.set(0,BELT_Y+0.8-0.1,-0.62);
const postR=postL.clone();postR.position.z=0.62;
const top=new THREE.Mesh(new THREE.BoxGeometry(.3,.2,1.42),archM);top.position.y=BELT_Y+1.55;
[postL,postR,top].forEach(m=>{m.castShadow=true;arch.add(m)});
const tunnelM=mat(0x15171c,{roughness:.5});
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,1.3),tunnelM);roof.position.y=BELT_Y+1.2;arch.add(roof);
const archLed=new THREE.Mesh(new THREE.BoxGeometry(.32,.03,1.44),new THREE.MeshBasicMaterial({color:0xdfe9ff}));archLed.position.y=BELT_Y+1.67;arch.add(archLed);
const panM=mat(0x4c535b,{metalness:.6,roughness:.4});
for(const z of [-0.55]){const pn=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.15,.04),panM);pn.position.set(0,BELT_Y+0.62,z);pn.castShadow=true;arch.add(pn);
  const st=new THREE.Mesh(new THREE.BoxGeometry(1.2,.08,.045),mat(0xE01E2B));st.position.set(0,BELT_Y+1.1,z*1.01);arch.add(st);
  const win=new THREE.Mesh(new THREE.PlaneGeometry(.5,.25),new THREE.MeshBasicMaterial({color:0x1c2630}));win.position.set(0,BELT_Y+0.8,z*1.06);win.rotation.y=z>0?0:Math.PI;arch.add(win);}
// laser fans (planes)
const laserM=new THREE.MeshBasicMaterial({color:0xff2a35,transparent:true,opacity:.0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const lasers=[];
for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.PlaneGeometry(0.03,1.4),laserM.clone());p.rotation.x=Math.PI/2;p.position.y=BELT_Y+0.4;arch.add(p);lasers.push(p);}
const laserLines=[];for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(0.008,0.004,0.6),new THREE.MeshBasicMaterial({color:0xff3540,transparent:true,opacity:0}));arch.add(l);laserLines.push(l);}
// status light
const okLamp=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),new THREE.MeshBasicMaterial({color:0x335533}));okLamp.position.set(0.2,BELT_Y+1.25,0.6);arch.add(okLamp);

// parcels on line A
const pA=[];const sizesA=[[.55,.32,.4],[.45,.28,.36],[.6,.25,.42],[.4,.35,.34],[.5,.3,.38]];
for(let i=0;i<14;i++){const s=sizesA[i%5];const hero=i===7;const p=makeParcel(...(hero?[.52,.32,.4]:s),i+3,hero);p.rotation.y=hero?0:(rnd()-.5)*.25;lineA.add(p);pA.push({g:p,off:i*1.45,hero});}

// ---------- SHOT C: tilt-tray sorter (placed at z offset 30)
const sorter=new THREE.Group();sorter.position.z=SZ;scene.add(sorter);
const TRAY_Y=1.0,TILT=25*Math.PI/180,PITCH=1.0,TV=1.25;
const railM=mat(0x7a818a,{metalness:.75,roughness:.35});
const rail=new THREE.Mesh(new THREE.BoxGeometry(60,.22,.5),railM);rail.position.set(0,TRAY_Y-0.38,0);rail.castShadow=true;sorter.add(rail);
for(let x=-30;x<=30;x+=2.5){const l=new THREE.Mesh(new THREE.BoxGeometry(.12,TRAY_Y-0.45,.12),mat(0x2b2b30,{metalness:.5}));l.position.set(x,(TRAY_Y-0.45)/2,0);sorter.add(l);}
for(const z of [-1.35]){const rl=new THREE.Mesh(new THREE.BoxGeometry(60,.05,.05),mat(0xF2C230,{roughness:.5}));rl.position.set(0,1.05,z);sorter.add(rl);
 for(let x=-30;x<=30;x+=1.5){const po=new THREE.Mesh(new THREE.BoxGeometry(.04,1.05,.04),mat(0xF2C230));po.position.set(x,.525,z);sorter.add(po);}}
const trays=[];
for(let i=0;i<34;i++){
  const t=new THREE.Group();const piv=new THREE.Group();t.add(piv);
  const c=PAL[i%PAL.length];
  const plate=new THREE.Mesh(new THREE.BoxGeometry(.86,.05,.9),mat(c,{roughness:.5,metalness:.05}));plate.position.y=-0.025;plate.castShadow=plate.receiveShadow=true;piv.add(plate);
  const lipM=mat(new THREE.Color(c).multiplyScalar(.7));
  for(const z of [-.45,.45]){const lip=new THREE.Mesh(new THREE.BoxGeometry(.86,.06,.02),lipM);lip.position.set(0,0.0,z);piv.add(lip);}
  const stem=new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.12),mat(0x2b2b30,{metalness:.6}));stem.position.y=-0.2;t.add(stem);
  sorter.add(t);trays.push({t,piv,i});
}
// chutes on +z side
const CH0=0.46, CHL=1.6;
function chute(xc,color,num){
  const g=new THREE.Group();g.position.set(xc,0,0);
  const y0=TRAY_Y-CH0*Math.tan(TILT);
  const pl=new THREE.Group();pl.position.set(0,y0,CH0);pl.rotation.x=TILT;g.add(pl);
  const bed=new THREE.Mesh(new THREE.BoxGeometry(2.4,.04,CHL),mat(0x9ca2aa,{metalness:.7,roughness:.42}));bed.position.set(0,-0.02,CHL/2);bed.receiveShadow=true;pl.add(bed);
  const sideM=mat(0x8a9099,{metalness:.75,roughness:.3});
  for(const x of [-1.22,1.22]){const s=new THREE.Mesh(new THREE.BoxGeometry(.04,.35,CHL),sideM);s.position.set(x,.175,CHL/2);s.castShadow=true;pl.add(s);}
  const end=new THREE.Mesh(new THREE.BoxGeometry(2.48,.3,.05),sideM);end.position.set(0,.15,CHL+0.025);pl.add(end);
  // support legs
  const yEnd=y0-CHL*Math.sin(TILT);
  for(const x of [-1.1,1.1]){const l=new THREE.Mesh(new THREE.BoxGeometry(.08,yEnd,.08),mat(0x2b2b30));l.position.set(x,yEnd/2,CH0+CHL*Math.cos(TILT)-0.1);g.add(l);}
  // number sign
  const c=document.createElement('canvas');c.width=256;c.height=160;const x=c.getContext('2d');x.fillStyle=num==='42'?'#E01E2B':'#1d2228';x.fillRect(0,0,256,160);x.fillStyle='#fff';x.font='700 96px Poppins';x.textAlign='center';x.fillText(num,128,118);
  const tx=new THREE.CanvasTexture(x.canvas);tx.colorSpace=THREE.SRGBColorSpace;
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(.6,.375),new THREE.MeshStandardMaterial({map:tx}));sign.position.set(0,1.55,-0.9);g.add(sign);
  const pole=new THREE.Mesh(new THREE.BoxGeometry(.05,1.4,.05),mat(0x2b2b30));pole.position.set(0,0.7,-0.95);g.add(pole);
  sorter.add(g);return {y0};
}
const chuteData=[chute(-5.2,0xF28C28,'41'),chute(0.2,0xE01E2B,'42'),chute(5.6,0x3BB273,'43'),chute(-10.6,0x2F6FDE,'40')];
const CHX=0.2;
// sorter parcels: one per tray except some empties
const pS=[];for(let i=0;i<34;i++){if(i%5===3)continue;const hero=i===17;const s=hero?[.5,.3,.4]:sizesA[i%5];
  const p=makeParcel(s[0]*.95,s[1],s[2]*.95,i+40,hero);p.rotation.y=0;sorter.add(p);pS.push({g:p,i,hero,h:s[1]});}
// hero sort timing: hero tray (i=17) passes x = trayX(t)
const trayX=(i,t)=>-20.4+i*PITCH+TV*(t-C0);


// ---- background colorful lines & lamps
const bgParcels=[];
for(const [z,col,dir] of [[-3.6,0x6d747d,1],[-7.2,0x6d747d,-1],[SZ-4.5,0x6d747d,1],[SZ-8,0x6d747d,-1]]){
  const fr=new THREE.Mesh(new THREE.BoxGeometry(80,.16,.9),mat(col,{metalness:.3,roughness:.45}));fr.position.set(0,1.1,z);fr.castShadow=true;scene.add(fr);
  const belt=new THREE.Mesh(new THREE.BoxGeometry(80,.02,.8),mat(0x222226,{roughness:.8}));belt.position.set(0,1.19,z);scene.add(belt);
  for(let x=-40;x<=40;x+=3){const l=new THREE.Mesh(new THREE.BoxGeometry(.08,1.05,.08),mat(0x2b2b30));l.position.set(x,.52,z);scene.add(l);}
  for(let i=0;i<40;i++){const sz=sizesA[(i*3)%5];const p=makeParcel(sz[0],sz[1],sz[2],100+i+z|0,false);p.rotation.y=(rnd()-.5)*.4;scene.add(p);bgParcels.push({g:p,off:i*2+rnd()*.6,z,dir});}
}
for(let i=0;i<40;i++){const c=PAL[i%PAL.length];const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,.12,20),new THREE.MeshBasicMaterial({color:0xf2f6ff}));
  lamp.position.set(-30+(i%20)*3,6.2,(i<20?-5:SZ-5)-(i%3)*3.5);scene.add(lamp);addCone(lamp.position);}

// ---------- timeline
const A0=0,A1=4.2,B0=4.2,B1=8.6,C0=8.6,C1=14.6,END=14.6;
const shots=[
 {t0:A0,t1:A1,num:'12 Mio.',small:'Pakete werden in Deutschland verschickt – pro Tag',sub:'Rund zwölf Millionen Pakete.<br>Jeden Tag.',src:'Quelle: KEP-Studie 2026 (BPEX), 4,37 Mrd. Sendungen 2025'},
 {t0:B0,t1:B1,num:'360°',small:'Kameras lesen den Barcode von allen Seiten',sub:'Ein Scanner liest den Code.<br>Niemand muss die Adresse lesen.',src:'Quelle: DHL Group, Sortiertechnik'},
 {t0:C0,t1:C1,num:'72.000',small:'Pakete pro Stunde im Paketzentrum Aschheim',sub:'An der richtigen Rutsche<br>kippt die Schale.',src:'Quelle: DHL Group, Paketzentrum Aschheim'},
];
const LINE_V=0.75;

function setTime(t){
  // ---- line A parcels & rollers
  const travel=t*LINE_V;
  rollers.forEach(r=>r.rotation.z=-travel/RR);
  pA.forEach(p=>{const x=-12+p.off+travel- (p.hero?0:0);p.g.position.set(x,BELT_Y,0);});
  // scanner effects: hero passes arch (x=3)
  const hero=pA.find(p=>p.hero);const hx=hero.g.position.x;const d=hx-3;
  const scanOn=Math.abs(d)<0.6?1:0;
  lasers.forEach((l,i)=>{l.material.opacity=scanOn*0.9*(0.6+0.4*Math.sin(t*40+i));l.position.x=Math.sin(t*9+i*1.6)*0.25;l.rotation.z=(i-1.5)*0.35;});
  laserLines.forEach((l,i)=>{l.material.opacity=scanOn;l.position.set(hx-3+(i-1)*0.12,BELT_Y+0.32+0.012,0);l.scale.z=1;});
  const passed=d>0.15;
  okLamp.material.color.set(passed?0x3BFF6A:(scanOn?0xff3540:0x334433));
  hero.g.userData.label.material.emissive=new THREE.Color(scanOn?0x331010:0x000000);
  bgParcels.forEach(b=>{let x=((b.off+t*0.7)%80)-40;b.g.position.set(b.dir*x,1.2,b.z);});
  // ---- sorter
  trays.forEach(o=>{const x=trayX(o.i,t);o.t.position.set(x,TRAY_Y,0);o.piv.rotation.x=0;});
  // hero tilt: starts when hero tray x reaches CHX-0.9
  const hTray=trays[17];const hx0=trayX(17,t);
  const tStart=C0+(CHX-0.95-trayX(17,C0))/TV;
  const tt=t-tStart;const tiltK=ease(clamp(tt/0.28,0,1))*(1-ease(clamp((tt-1.4)/0.35,0,1)));
  hTray.piv.rotation.x=TILT*tiltK;
  pS.forEach(p=>{const tx=trayX(p.i,t);
    if(!p.hero){p.g.position.set(tx,TRAY_Y,0);p.g.rotation.set(0,0,0);return;}
    // slide along plane rotated by tilt about x (z->down). s along local z
    const ts=tt-0.22; // slides after tilt mostly reached
    let s=0,xv=tx;
    if(ts>0){
      const a=2.4, vmax=1.9;
      const tAcc=vmax/a;
      s=ts<tAcc?0.5*a*ts*ts:0.5*a*tAcc*tAcc+vmax*(ts-tAcc);
      const sEnd=CH0/Math.cos(TILT)+CHL-0.2-0.05; // stop before end wall
      if(s>sEnd-0.25){ // soft stop
        const over=s-(sEnd-0.25);s=sEnd-0.25*Math.exp(-over/0.25);
      }
      // x: inherits tray speed, decays once off tray
      const xs=trayX(17,tStart+0.22);const k=1.6;
      xv=xs+TV*(1-Math.exp(-k*ts))/k;
    }
    const ang=(ts>0)?TILT:hTray.piv.rotation.x;
    // position on plane through tray-top pivot (x,TRAY_Y,0)
    p.g.position.set(xv,TRAY_Y-Math.sin(ang)*s,Math.cos(ang)*s);
    p.g.rotation.set(ang,0,0);
  });

  // ---- camera per shot
  let s=shots.findIndex(o=>t>=o.t0&&t<o.t1);if(s<0)s=shots.length-1;const sh=shots[s];const u=(t-sh.t0)/(sh.t1-sh.t0);
  if(s===0){ // low dolly beside hero parcel
    const fx=-1.0+u*1.7;cam.position.set(fx-2.0,BELT_Y+0.75,2.4-u*0.25);cam.lookAt(fx+0.1,BELT_Y+0.15,0);cam.fov=34;
    sun.position.set(fx-6,12,8);sun.target.position.set(fx,0,0);
  }else if(s===1){
    cam.position.set(3-2.6+u*0.5,BELT_Y+1.1,4.6-u*0.3);cam.lookAt(2.8,BELT_Y+0.45,0);cam.fov=44;
    sun.position.set(-3,12,8);sun.target.position.set(3,0,0);
  }else{
    const fx=CHX;cam.position.set(fx+1.6-u*0.5,3.3-u*0.15,SZ+6.6-u*0.4);cam.lookAt(fx+0.1,0.75,SZ+0.7);cam.fov=40;
    sun.position.set(fx-6,12,SZ+8);sun.target.position.set(fx,0,SZ);
  }
  cam.updateProjectionMatrix();
  // ---- overlay with fades
  const fi=clamp((t-sh.t0)/0.35,0,1),fo=clamp((sh.t1-t)/0.3,0,1);const op=s===shots.length-1?fi:Math.min(fi,fo);
  num.innerHTML=sh.num+'<small>'+sh.small+'</small><i></i>';num.style.opacity=op;
  sub.innerHTML=sh.sub;sub.style.opacity=op;srcEl.textContent=sh.src;srcEl.style.opacity=op*1;
  return {s,u,blend:Math.min(clamp((t-sh.t0)/0.25,0,1),s===shots.length-1?1:clamp((sh.t1-t)/0.25,0,1))};
}
const num=document.getElementById('num'),sub=document.getElementById('sub'),srcEl=document.getElementById('src');

// ---------- post (grain/vignette/warm grade, shot fade)
const rt=new THREE.WebGLRenderTarget(W,H,{samples:4,type:THREE.HalfFloatType});
const postScene=new THREE.Scene();const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const post=new THREE.ShaderMaterial({uniforms:{tex:{value:rt.texture},seed:{value:0},fade:{value:1}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tex;uniform float seed,fade;varying vec2 v;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed)*43758.5453);}
 void main(){vec3 c=texture2D(tex,v).rgb;
  c*=1.2;c=mix(c,c*vec3(.96,1.0,1.05),.7);
  float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.12);
  vec2 q=v-.5;q.x*=.62;float vig=smoothstep(.85,.25,length(q));c*=mix(.4,1.,vig);
  c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
  c+=(h(v*vec2(1080.,1920.))-.5)*.06;
  c*=fade;gl_FragColor=vec4(pow(max(c,0.),vec3(1./2.2)),1.);}`});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
window.FPS=30;window.TOTAL=Math.round(END*30);
window.renderAt=async(f)=>{const t=f/30;const r=setTime(t);
  renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
  renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);
  post.uniforms.seed.value=(f*7.13)%100;post.uniforms.fade.value=0.15+0.85*r.blend;
  renderer.render(postScene,postCam);return true;};
await document.fonts.ready;
window.ready=true;
</script></body></html>
