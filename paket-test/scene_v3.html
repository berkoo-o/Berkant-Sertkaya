<script type="module">
import * as THREE from 'three';

// pools of light over action areas (like reference)

function labelTex(seed,hero){return canvasTex(512,340,(g)=>{
  g.fillStyle='#f4f2ec';g.fillRect(0,0,512,340);
  g.fillStyle='#222';g.font='600 30px Poppins';g.fillText(hero?'AN: M. Muster':'AN: Kunde '+seed,28,52);
  g.font='500 24px Poppins';g.fillText('Beispielweg '+(seed%90+1),28,88);g.fillText(String((10115+seed*37)%99999).padStart(5,'0')+' Stadt',28,120);
  let x=28;const r=(s=>()=>(s=(s*48271)%2147483647)/2147483647)(seed*99+7);

  for(let i=0;i<20000;i++){g.fillStyle=`rgba(${rnd()>.5?255:0},${rnd()>.5?255:0},${rnd()>.5?255:0},${rnd()*.025})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*3,1+rnd()*3);}

function makeParcel(w,h,d,seed,hero){

  const b=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,0.012),new THREE.MeshStandardMaterial({color:tint,map:kraftTex,roughness:.88,metalness:0}));
  b.position.y=h/2;b.castShadow=b.receiveShadow=true;g.add(b);
  const tm=new THREE.MeshStandardMaterial({color:hero?0xd8141f:0xd6c49a,roughness:hero?.32:.45,metalness:0,envMapIntensity:hero?1.2:.6,emissive:hero?0x200000:0});

  t1.geometry=new THREE.BoxGeometry(tw,0.003,d+0.004);t1.rotation.y=0;t1.scale.set(1,1,1);g.add(t1); // lengthwise along z over top

  const lw=Math.min(w/2-tw/2-0.035,0.2),lh=lw*340/512;
  const lab=new THREE.Mesh(new THREE.PlaneGeometry(lw,lh),new THREE.MeshStandardMaterial({map:labelTex(seed,hero),roughness:.55}));
  lab.rotation.x=-Math.PI/2;lab.position.set(-w/2+lw/2+0.02,h+0.004,-d/2+lh/2+0.03);g.add(lab);
  g.userData={w,h,d};return g;
}

// ---------- hall

const lampGeo=new THREE.CylinderGeometry(.28,.36,.14,24),lampMat=new THREE.MeshBasicMaterial({color:0xf4f7ff});

  if(cone){const c=new THREE.Mesh(new THREE.CylinderGeometry(.27,2.6,CEIL-0.5,32,1,true),coneMat);c.position.set(x,(CEIL-0.5)/2,z);scene.add(c);}}
for(const zc of [0,30]){
  for(let zz=-14;zz<=6;zz+=4){const t=box(80,.35,.18,darkSteel,0,CEIL,zc+zz,scene);t.castShadow=false;}
  for(let x=-36;x<=36;x+=6){const t=box(.18,.3,24,darkSteel,x,CEIL-0.1,zc-4,scene);t.castShadow=false;}
  for(let x=-30;x<=30;x+=4.5)for(let zz=-12;zz<=4;zz+=4)lamp(x+(zz%8?2.25:0),zc+zz,Math.abs(zz)<9&&Math.abs(x)<12);
  // columns
  for(let x=-36;x<=36;x+=9){box(.4,CEIL,.4,mat(0x2a3038,{metalness:.5,roughness:.5}),x,CEIL/2,zc-9,scene);}
}
// mezzanine walkway with yellow railing in background (like reference)
function mezz(zc){const g=new THREE.Group();g.position.z=zc;scene.add(g);
  box(80,.12,1.6,darkSteel,0,3.2,0,g);

  box(80,.05,.05,yellow,0,4.25,0.78,g);box(80,.05,.05,yellow,0,3.8,0.78,g);

// ---------- roller conveyor builder
const BELT_Y=0.85,RR=0.032,RP=0.085;
const rollerGeo=new THREE.CylinderGeometry(RR,RR,0.78,20);rollerGeo.rotateX(Math.PI/2);
const allRollers=[];
function rollerConveyor(z,x0,x1,y=BELT_Y,legs=true){
  const g=new THREE.Group();scene.add(g);const L=x1-x0,xc=(x0+x1)/2;
  for(const s of [-1,1]){box(L,.16,.04,steel,xc,y-0.04,z+s*0.42,g);box(L,.03,.08,steel,xc,y-0.115,z+s*0.40,g);}
  if(legs)for(let x=x0+0.6;x<x1;x+=2.0){for(const s of [-1,1])box(.06,y-0.12,.06,darkSteel,x,(y-0.12)/2,z+s*0.38,g);box(.04,.04,.76,darkSteel,x,0.3,z,g);}
  for(let x=x0+RP/2;x<x1;x+=RP){const r=new THREE.Mesh(rollerGeo,galv);r.position.set(x,y-RR,z);r.receiveShadow=true;g.add(r);allRollers.push(r);}
  return g;}
rollerConveyor(0,-14,14);
rollerConveyor(-2.6,-30,30,1.0);
rollerConveyor(-5.0,-30,30,1.0);

// ---------- scanner portal at x=3 (open frame, camera heads)
const SX=3;const scan=new THREE.Group();scan.position.x=SX;scene.add(scan);
const portalM=mat(0x7d848c,{metalness:.8,roughness:.3});
for(const dx of [-0.32,0.32])for(const s of [-1,1])box(.09,2.05,.09,portalM,dx,1.025,s*0.62,scan);

for(const s of [-1,1]){box(.72,.06,.06,portalM,0,BELT_Y+0.15,s*0.62,scan);box(.72,.06,.06,portalM,0,1.75,s*0.62,scan);}

  box(.1,.08,.12,mat(0x9aa1a9,{metalness:.6,roughness:.35}),0,0,0,h);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(.04,.045,.05,20),mat(0x05070a,{metalness:.9,roughness:.1}));lens.rotation.x=Math.PI/2;lens.position.z=0.095;h.add(lens);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.042,.004,8,24),new THREE.MeshBasicMaterial({color:0xb01822}));ring.position.z=0.12;h.add(ring);
  h.lookAt(new THREE.Vector3(...lookAt).add(new THREE.Vector3(SX,0,0)));heads.push(h);return h;}

// laser beams (thin additive cylinders) from heads to parcel
const beamMat=new THREE.MeshBasicMaterial({color:0xff2030,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});

// ---------- parcels line A
const sizes=[[.5,.3,.38],[.42,.26,.34],[.56,.24,.4],[.38,.32,.32],[.46,.28,.36]];
const LINE_V=0.75;
const pA=[];
for(let i=0;i<14;i++){const hero=i===7;const s=hero?[.5,.3,.4]:sizes[i%5];const p=makeParcel(...s,i+3,hero);scene.add(p);pA.push({g:p,off:i*1.45,hero,rot:hero?0:(rnd()-.5)*.2});}

// laser lines on hero top
const laserTop=new THREE.Group();hero.add(laserTop);
{const hd=hero.userData;const lm=new THREE.MeshBasicMaterial({color:0xff2a35});
 for(const a of [-0.5,0,0.5]){const l=new THREE.Mesh(new THREE.PlaneGeometry(0.004,Math.hypot(hd.w,hd.d)*0.8),lm);l.rotation.x=-Math.PI/2;l.rotation.z=a;l.position.y=hd.h+0.006;laserTop.add(l);}}

// ---------- SORTER (z offset 30)
const SZ=30;const sorter=new THREE.Group();sorter.position.z=SZ;scene.add(sorter);
const TRAY_Y=1.0,TILT=25*Math.PI/180,PITCH=1.0,TV=1.25,CHX=0.2;
// track: chain housing with side plates
box(60,.26,.42,darkSteel,0,TRAY_Y-0.36,0,sorter);
for(const s of [-1,1])box(60,.08,.02,galv,0,TRAY_Y-0.27,s*0.22,sorter);
for(let x=-30;x<=30;x+=2.0){box(.1,TRAY_Y-0.49,.1,darkSteel,x,(TRAY_Y-0.49)/2,-0.12,sorter);box(.1,TRAY_Y-0.49,.1,darkSteel,x,(TRAY_Y-0.49)/2,0.12,sorter);}
// safety railing behind sorter
for(let x=-30;x<=30;x+=1.5)box(.04,1.05,.04,yellow,x,.525,-1.4,sorter);box(60,.05,.05,yellow,0,1.05,-1.4,sorter);box(60,.05,.05,yellow,0,.6,-1.4,sorter);
const trayM=mat(0x6c727a,{roughness:.6,metalness:.05});const trayEdge=mat(0x565c63,{roughness:.6});
const trays=[];
for(let i=0;i<34;i++){
  const t=new THREE.Group();const piv=new THREE.Group();t.add(piv);
  box(.86,.035,.9,trayM,0,-0.0175,0,piv);
  for(const s of [-1,1])box(.025,.06,.9,trayEdge,s*0.4425,0.03,0,piv);
  box(.86,.06,.025,trayEdge,0,0.03,-0.4375,piv);
  box(.3,.22,.3,darkSteel,0,-0.15,0,t);
  for(const s of [-1,1]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.04,16),mat(0x15181c,{roughness:.7}));wh.rotation.x=Math.PI/2;wh.position.set(s*0.12,-0.24,0.2);t.add(wh);}

// chutes on +z side
const CH0=0.46,CHL=1.6;
function chute(xc,num){
  const g=new THREE.Group();g.position.set(xc,0,0);
  const y0=TRAY_Y-CH0*Math.tan(TILT);
  const pl=new THREE.Group();pl.position.set(0,y0,CH0);pl.rotation.x=TILT;g.add(pl);
  const bed=box(2.4,.03,CHL,mat(0x6a7077,{metalness:.85,roughness:.5}),0,-0.015,CHL/2,pl);
  for(const s of [-1,1])box(.035,.4,CHL,galv,s*1.22,.2,CHL/2,pl);
  box(2.48,.32,.035,galv,0,.16,CHL+0.018,pl);
  const yEnd=y0-CHL*Math.sin(TILT);const zEnd=CH0+CHL*Math.cos(TILT);

  const red=num==='42';

  const sign=new THREE.Mesh(new THREE.PlaneGeometry(.5,.31),new THREE.MeshStandardMaterial({map:tex,roughness:.5,emissive:red?0x400000:0}));sign.position.set(0,1.55,-0.9);g.add(sign);

chute(CHX,'42');chute(CHX-5.4,'41');chute(CHX+5.4,'43');chute(CHX-10.8,'40');
const pS=[];for(let i=0;i<34;i++){if(i%5===3)continue;const h=i===17;const s=h?[.5,.3,.4]:sizes[i%5];
  const p=makeParcel(s[0]*.95,s[1],s[2]*.95,i+40,h);sorter.add(p);pS.push({g:p,i,hero:h});}
const C0=8.6;
const trayX=(i,t)=>-20.4+i*PITCH+TV*(t-C0);

// ---------- timeline / overlay
const A0=0,A1=4.2,B0=4.2,B1=8.6,C1=14.6,END=14.6;
const shots=[
 {t0:A0,t1:A1,num:'12 Mio.',small:'Pakete werden in Deutschland verschickt – pro Tag',sub:'Rund zwölf Millionen Pakete.<br>Jeden Tag.',src:'Quelle: KEP-Studie 2026 (BPEX), 4,37 Mrd. Sendungen 2025'},
 {t0:B0,t1:B1,num:'360°',small:'Kameras lesen den Barcode von allen Seiten',sub:'Ein Scanner liest den Code.<br>Niemand muss die Adresse lesen.',src:'Quelle: DHL Group, Sortiertechnik'},
 {t0:C0,t1:C1,num:'72.000',small:'Pakete pro Stunde im Paketzentrum Aschheim',sub:'An der richtigen Rutsche<br>kippt die Schale.',src:'Quelle: DHL Group, Paketzentrum Aschheim'},
];
const num=document.getElementById('num'),sub=document.getElementById('sub'),srcEl=document.getElementById('src');
const up=new THREE.Vector3(0,1,0),tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3();

    const len=tmpA.distanceTo(tmpB);b.scale.set(1,len,1);b.position.copy(tmpA).add(tmpB).multiplyScalar(.5);
    b.quaternion.setFromUnitVectors(up,tmpB.clone().sub(tmpA).normalize());});
  beacon.material.color.set(d>0.3?0x33ff66:(on?0xff3040:0x1a2a1c));
  // sorter
  trays.forEach(o=>{o.t.position.set(trayX(o.i,t),TRAY_Y,0);o.piv.rotation.x=0;});
  const hT=trays[17];
  const tStart=C0+(CHX-0.95-trayX(17,C0))/TV;const tt=t-tStart;
  const tiltK=ease(clamp(tt/0.28,0,1))*(1-ease(clamp((tt-1.4)/0.35,0,1)));
  hT.piv.rotation.x=TILT*tiltK;
  pS.forEach(p=>{const tx=trayX(p.i,t);
    if(!p.hero){p.g.position.set(tx,TRAY_Y,0);p.g.rotation.set(0,0,0);return;}
    const ts=tt-0.22;let s=0,xv=tx;
    if(ts>0){const a=2.4,vmax=1.9,tAcc=vmax/a;
      s=ts<tAcc?0.5*a*ts*ts:0.5*a*tAcc*tAcc+vmax*(ts-tAcc);
      const sEnd=CH0/Math.cos(TILT)+CHL-0.2-0.05;
      if(s>sEnd-0.25){const over=s-(sEnd-0.25);s=sEnd-0.25*Math.exp(-over/0.25);}
      const xs=trayX(17,tStart+0.22),k=1.6;xv=xs+TV*(1-Math.exp(-k*ts))/k;}
    const ang=ts>0?TILT:hT.piv.rotation.x;
    p.g.position.set(xv,TRAY_Y-Math.sin(ang)*s,Math.cos(ang)*s);p.g.rotation.set(ang,0,0);});
  // cameras
  let si=shots.findIndex(o=>t>=o.t0&&t<o.t1);if(si<0)si=shots.length-1;const sh=shots[si];const u=(t-sh.t0)/(sh.t1-sh.t0);
  if(si===0){const fx=hx;
    cam.position.set(fx-1.35-u*0.2,BELT_Y+0.6,1.35);cam.lookAt(fx-0.2,BELT_Y+0.12,0.1);cam.fov=40;
    key.position.set(fx-3,9,5);key.target.position.set(fx,0,0);
  }else if(si===1){
    cam.position.set(SX+5.2-u*0.5,BELT_Y+1.9,1.6-u*0.15);cam.lookAt(SX-0.1,BELT_Y+0.95,0);cam.fov=40;
    key.position.set(SX-3,9,5);key.target.position.set(SX,0,0);
  }else{
    cam.position.set(CHX+1.6-u*0.5,3.3-u*0.15,SZ+6.4-u*0.4);cam.lookAt(CHX+0.1,0.75,SZ+0.7);cam.fov=40;
    key.position.set(CHX-3,9,SZ+5);key.target.position.set(CHX,0,SZ);
  }
  cam.updateProjectionMatrix();
  const fi=clamp((t-sh.t0)/0.35,0,1),fo=clamp((sh.t1-t)/0.3,0,1);const op=si===shots.length-1?fi:Math.min(fi,fo);
  num.innerHTML=sh.num+'<small>'+sh.small+'</small><i></i>';num.style.opacity=op;
  sub.innerHTML=sh.sub;sub.style.opacity=op;srcEl.textContent=sh.src;srcEl.style.opacity=op;
  return Math.min(clamp((t-sh.t0)/0.25,0,1),si===shots.length-1?1:clamp((sh.t1-t)/0.25,0,1));
}

// ---------- post: ACES, cool grade, vignette, very light grain
const rt=new THREE.WebGLRenderTarget(W,H,{samples:4,type:THREE.HalfFloatType});
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const post=new THREE.ShaderMaterial({uniforms:{tex:{value:rt.texture},seed:{value:0},fade:{value:1}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tex;uniform float seed,fade;varying vec2 v;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed)*43758.5453);}
 void main(){vec3 c=texture2D(tex,v).rgb*1.1;
  c=mix(c,c*vec3(.97,1.0,1.04),.8);
  c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
  vec2 q=v-.5;q.x*=.62;c*=mix(.5,1.,smoothstep(.8,.2,length(q)));
  c=pow(max(c,0.),vec3(1./2.2));
  c+=(h(v*vec2(1080.,1920.))-.5)*.012;
  gl_FragColor=vec4(c*fade,1.);}`});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
window.TOTAL=Math.round(END*30);
window.renderAt=async(f)=>{const fade=setTime(f/30);
  renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);
  post.uniforms.seed.value=(f*7.13)%100;post.uniforms.fade.value=0.15+0.85*fade;
  renderer.render(postScene,postCam);return true;};
window.ready=true;
