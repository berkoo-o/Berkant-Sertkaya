  if(o>=1.7){if(!coinScr){setCam(O+1.7);const c=proj([SPIN_P[0],T*0.5,SPIN_P[2]]),e=proj([SPIN_P[0]+R,T*0.5,SPIN_P[2]]);coinScr=[c[0],c[1],Math.hypot(e[0]-c[0],e[1]-c[1])];setCam(t);}
    const u=eio(clamp((o-1.7)/0.5,0,1));const x=lerp(coinScr[0],L.dcx,u),y=lerp(coinScr[1],L.dcy,u),r=lerp(coinScr[2],L.dr,u);oc.save();oc.shadowColor='rgba(224,30,43,0.7)';oc.shadowBlur=lerp(30,10,u);oc.fillStyle='#E01E2B';oc.beginPath();oc.arc(x,y,r,0,7);oc.fill();oc.restore();}
}
window.TOTAL=Math.round(END*30);
window.renderAt=async f=>{const t=f/30;setTime(t);composer.render();drawOutro(t);const fd=Math.min(clamp(t/0.3,0,1),clamp((END-t)/0.25,0,1));document.body.style.filter=fd<1?`brightness(${fd})`:'none';return true;};
await window.renderAt(0);window.ready=true;
