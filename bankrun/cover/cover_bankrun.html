if(V===2){C.children.filter(o=>o.isGroup&&o.children.length===4&&o.position.z===0.42).forEach((o,k)=>{const t=k/11;o.position.set(-0.15-1.0*Math.sin(t*1.5),0.16,0.3+0.55*t*t);o.rotation.y=Math.PI*0.6+0.9*t;});}
else C.children.filter(o=>o.isGroup&&o.children.length===4).forEach(o=>o.position.y=0.16);

const shp=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:.5}));shp.rotation.x=-Math.PI/2;shp.receiveShadow=true;scene.add(shp);
const o=new THREE.Vector3(0,0,0).project(cam);cam.setViewOffset(W,H,(o.x+1)/2*W-CX,(1-o.y)/2*H-CY,W,H);cam.updateProjectionMatrix();
renderer.render(scene,cam);
fg.save();fg.globalCompositeOperation='lighter';fg.filter='blur(22px) brightness(1.1)';fg.globalAlpha=.26;fg.drawImage(renderer.domElement,0,0);fg.restore();
window.ready=true;
