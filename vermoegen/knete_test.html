// In der Mitte die Szene aus dem Stiltest: alles, was den reichsten zehn Prozent gehört, trägt ein rotes Fähnchen, vorne zehn Figuren, die reichste rot.
import * as THREE from 'three';

import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
await Promise.all(['500 40px Poppins', '800 96px "Inter Tight"'].map(f => document.fonts.load(f)));
const W = 1080, H = 1920, V = +(new URLSearchParams(location.search).get('v') || 1);
const RED = 0xE01E2B;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); renderer.setSize(W, H); renderer.setPixelRatio(1);

// ---------------- clay material: matte, soft lumps and fingerprints ----------------
const clayBump = tex(512, 512, (g, w, h) => {g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {const x = rng() * w, y = rng() * h, r = 2 + rng() * 12; const gr = g.createRadialGradient(x, y, 0, x, y, r); const v = rng() < 0.5 ? 255 : 0;
    gr.addColorStop(0, `rgba(${v},${v},${v},0.09)`); gr.addColorStop(1, 'rgba(128,128,128,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);}

for (const x of XS) {add(W0, rbox(0.42, 0.022, EXT, 0.008), streetM, x, 0.013, -6); for (const s of [-1, 1]) add(W0, rbox(0.22, 0.042, EXT, 0.015), walkM, x + s * 0.32, 0.021, -6);}

// ---------------- buildings ----------------

  const F = new THREE.Group(); F.position.set(0, y, 0); F.scale.setScalar(sc); par.add(F);
  add(F, new THREE.CylinderGeometry(0.009, 0.009, 0.3, 10), clay(0xf3ece0), 0, 0.15, 0);
  const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.quadraticCurveTo(0.09, -0.01, 0.17, -0.045); sh.quadraticCurveTo(0.09, -0.07, 0, -0.095); sh.closePath();

function building(o) {

  const c = o.col ?? PAL.houses[(o.c || 0) % PAL.houses.length];

    const g = new THREE.ExtrudeGeometry(r, {depth: o.d + 0.04, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 3}); g.translate(0, 0, -(o.d + 0.04) / 2);

  // a door on the front

  if (o.t === 'factory') {for (const [x, hh] of [[-0.28, 0.75], [0.0, 0.6]]) add(G, new THREE.CylinderGeometry(0.065, 0.08, hh, 16), clay(0xf6b38f), x, o.h + hh / 2, -0.15);
    for (const [x, y] of [[-0.28, 0.75], [0.0, 0.6]]) for (let k = 0; k < 3; k++) add(G, new THREE.SphereGeometry(0.07 + k * 0.025, 14, 12), clay(0xf4f1f7, {bumpScale: 1}), x + k * 0.05, o.h + y + 0.08 + k * 0.09, -0.15 - k * 0.02);   // clay smoke puffs
    for (let i = 0; i < 3; i++) {const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(0.25, 0); s.lineTo(0, 0.14); s.closePath(); const g = new THREE.ExtrudeGeometry(s, {depth: o.d * 0.7, bevelEnabled: true, bevelSize: .01, bevelThickness: .01}); g.translate(0, 0, -o.d * 0.35);
      add(G, g, clay(0xf7dd7c), 0.06 + i * 0.13 - 0.2, o.h + 0.06, 0.12);}}

  if (o.t === 'villa') add(G, rbox(0.3, 0.02, 0.13, 0.008), clay(0x46b6e0, {roughness: .4, bumpScale: .4}), 0, 0.02, o.d / 2 + 0.11);

  return G;}
function tree(x, z, s = 1) {const T = new THREE.Group(); T.position.set(x, 0.01, z); T.scale.setScalar(s); W0.add(T);
  add(T, new THREE.CylinderGeometry(0.02, 0.026, 0.14, 10), clay(0xa0704a), 0, 0.07, 0);
  add(T, new THREE.IcosahedronGeometry(0.15, 2), clay(PAL.tree[Math.floor(rng() * 3)]), 0, 0.27, 0); if (rng() < 0.5) add(T, new THREE.IcosahedronGeometry(0.1, 2), clay(PAL.tree[Math.floor(rng() * 3)]), 0.06, 0.4, 0.02);}

  add(C, rbox(0.34, 0.08, 0.16, 0.035), m, 0, 0.06, 0); add(C, rbox(0.2, 0.07, 0.15, 0.03), m, -0.02, 0.13, 0);
  for (const [wx, wz] of [[-0.11, 0.08], [0.11, 0.08], [-0.11, -0.08], [0.11, -0.08]]) add(C, new THREE.CylinderGeometry(0.03, 0.03, 0.025, 14).rotateX(Math.PI / 2), clay(0x3e3f5a), wx, 0.03, wz);}

// the centre: the scene from the style test (owned by the richest 10 % → red flag)
const CORE = [
  {t: 'factory', x: -1.45, z: -1.2, w: 1.0, d: 0.75, h: 0.75, own: 1, fx: 0.36, fz: 0.22, col: 0xc4a8f0},
  {t: 'tower', x: -0.3, z: -1.25, w: 0.62, d: 0.62, h: 2.2, own: 1, col: 0x9cc8f2},
  {t: 'block', x: 0.72, z: -1.2, w: 0.95, d: 0.65, h: 1.45, own: 1, c: 1},
  {t: 'house', x: 1.62, z: -1.22, w: 0.52, d: 0.55, h: 0.6, own: 0, c: 4},
  {t: 'house', x: -1.68, z: -0.12, w: 0.5, d: 0.52, h: 0.5, own: 0, c: 5},
  {t: 'block', x: -0.88, z: -0.15, w: 0.78, d: 0.62, h: 1.05, own: 1, c: 0},
  {t: 'villa', x: 0.12, z: -0.12, w: 0.72, d: 0.58, h: 0.55, own: 1, c: 2},
  {t: 'block', x: 1.0, z: -0.15, w: 0.62, d: 0.6, h: 1.2, own: 1, c: 3},
  {t: 'house', x: 1.72, z: -0.1, w: 0.42, d: 0.5, h: 0.48, own: 0, c: 1},
  {t: 'house', x: 1.72, z: -0.62, w: 0.4, d: 0.36, h: 0.42, own: 0, c: 2}];
CORE.forEach(building);
for (const [x, z] of [[-1.9, 0.24], [-0.42, 0.24], [0.62, 0.24], [1.95, 0.24], [-1.05, -0.64], [1.25, -0.7]]) tree(x, z);
// the rest of the town: every block between the streets is filled, more than half of it belongs to the richest (big buildings mostly)
function fillBlock(x0, x1, z0, z1) {
  const mx = 0.5, mz = 0.48; let z = z1 - mz;   // front row faces the street at z1
  while (z - 0.3 > z0 + 0.25) {let x = x0 + mx * 0.6; const rowD = 0.5 + rng() * 0.25;
    while (x + 0.45 < x1 - 0.2) {const r = rng(), big = r < 0.45, w = big ? 0.6 + rng() * 0.35 : 0.42 + rng() * 0.2, d = Math.min(rowD, big ? 0.55 + rng() * 0.2 : 0.42 + rng() * 0.12);
      if (x + w > x1 - 0.2) break;
      if (rng() < 0.12) {tree(x + w / 2, z - d / 2, 0.9 + rng() * 0.4); x += w + 0.12; continue;}
      const t = big ? (rng() < 0.2 ? 'tower' : 'block') : 'house', h = t === 'tower' ? 1.6 + rng() * 0.8 : big ? 0.8 + rng() * 0.6 : 0.4 + rng() * 0.25;
      building({t, x: x + w / 2, z: z - d / 2, w, d, h, own: big ? (rng() < 0.85 ? 1 : 0) : (rng() < 0.25 ? 1 : 0), c: Math.floor(rng() * 8)});
      x += w + 0.1 + rng() * 0.08;}
    z -= rowD + 0.28;}}
for (let i = 0; i < XS.length - 1; i++) for (const [z0, z1] of [[-5.42, -2.88], [-8.62, -6.08], [-12, -9.28]]) fillBlock(XS[i] + 0.45, XS[i + 1] - 0.45, z0, z1);
fillBlock(-12, XS[0] - 0.45, -5.42, -2.88); fillBlock(XS[3] + 0.45, 12, -5.42, -2.88); fillBlock(-12, XS[0] - 0.45, -2.25, 0.3); fillBlock(XS[3] + 0.45, 12, -2.25, 0.3);
fillBlock(-12, XS[0] - 0.45, -8.62, -6.08); fillBlock(XS[3] + 0.45, 12, -8.62, -6.08);
fillBlock(-6.85, -2.9, -2.25, 0.3); fillBlock(2.9, 6.85, -2.25, 0.3);
fillBlock(-6.85, -2.9, 1.5, 3.42); fillBlock(2.9, 6.85, 1.5, 3.42);
// in front of the ten figures: a low park, so nothing hides them (fountain, bushes, benches)
{add(W0, new THREE.CylinderGeometry(0.42, 0.46, 0.08, 40), clay(0xf3e3c8), 0, 0.04, 2.5); add(W0, new THREE.CylinderGeometry(0.34, 0.34, 0.03, 40), clay(0x7fc8ee, {roughness: .35, bumpScale: .6}), 0, 0.085, 2.5);
 add(W0, new THREE.CylinderGeometry(0.04, 0.06, 0.22, 16), clay(0xf3e3c8), 0, 0.16, 2.5); add(W0, new THREE.SphereGeometry(0.07, 16, 12), clay(0xcfeeff, {bumpScale: .5}), 0, 0.3, 2.5);
 for (const [x, z] of [[-1.7, 1.9], [-1.25, 2.9], [-0.8, 1.85], [0.8, 1.9], [1.3, 2.95], [1.75, 1.95], [-1.8, 3.2], [1.85, 3.25]]) {const b = add(W0, new THREE.IcosahedronGeometry(0.13 + rng() * 0.05, 2), clay(PAL.tree[Math.floor(rng() * 3)]), x, 0.1, z); b.scale.y = 0.75;}
 for (const x of [-0.75, 0.75]) {const B = new THREE.Group(); B.position.set(x, 0, 2.5); B.rotation.y = x < 0 ? 0.5 : -0.5; W0.add(B); add(B, rbox(0.26, 0.03, 0.09, 0.012), clay(0xd9a07a), 0, 0.08, 0); add(B, rbox(0.26, 0.08, 0.02, 0.01), clay(0xd9a07a), 0, 0.13, -0.04);
   for (const sx of [-0.1, 0.1]) add(B, rbox(0.02, 0.07, 0.07, 0.006), clay(0x3e3f5a), sx, 0.035, 0);}}
for (let i = 0; i < 9; i++) tree(-6.5 + i * 1.6 + rng() * 0.3, 4.3 + rng() * 0.3, 1.1);
// cars on the streets
[[-0.9, 0.7, 0], [1.05, 0.54, 1], [-4.2, -2.47, 2], [3.6, -2.63, 3], [0.2, -5.67, 1], [-2.37, -4.0, 0, Math.PI / 2], [2.53, -1.6, 2, Math.PI / 2], [5.0, 0.7, 3], [-5.5, 0.54, 2]].forEach(([x, z, c, r]) => car(x, z, c, r || 0));
// the ten figures: each one stands for ten percent of the people, the richest is red
function figure(x, z, c, rich) {const G = new THREE.Group(); G.position.set(x, 0.045, z); G.rotation.y = (rng() - 0.5) * 0.25; W0.add(G); const k = 2.3; const col = rich ? RED : c;
  for (const sx of [-1, 1]) add(G, new THREE.CylinderGeometry(0.013 * k, 0.012 * k, 0.06 * k, 14), clay(0x3e3f5a), sx * 0.012 * k, 0.03 * k, 0);
  add(G, new THREE.CapsuleGeometry(0.03 * k, 0.045 * k, 6, 16), clay(col), 0, 0.1 * k, 0); add(G, new THREE.SphereGeometry(0.024 * k, 18, 14), clay(0xf3c9a5), 0, 0.165 * k, 0);

for (let i = 0; i < 10; i++) figure(-1.6 + i * 0.35, 1.15, PAL.people[i % PAL.people.length], i === 9);
// people walking elsewhere in town
for (let i = 0; i < 26; i++) {const z = ZS[Math.floor(rng() * 4)] + (rng() < 0.5 ? -0.32 : 0.32), x = -7 + rng() * 14; if (Math.abs(z - 1.12) < 0.4 && Math.abs(x) < 2.2) continue; const G = new THREE.Group(); G.position.set(x, 0.045, z); W0.add(G); const k = 1.6;

if (V === 2) {for (let i = 0; i < 9; i++) {const r = 2.5 + rng() * 2.5; add(W0, new THREE.SphereGeometry(r, 32, 20), clay(PAL.tree[i % 3], {bumpScale: 4}), -16 + i * 4 + rng(), -r * 0.62, -15 - rng() * 3);}
  for (let i = 0; i < 5; i++) {const C = new THREE.Group(); C.position.set(-6 + i * 3.2 + rng(), 4 + rng() * 1.5, -17); W0.add(C); for (let k = 0; k < 4; k++) add(C, new THREE.SphereGeometry(0.5 + rng() * 0.4, 18, 14), clay(0xffffff, {bumpScale: 1.5}), k * 0.55 - 0.8, rng() * 0.25, 0);}}

// ---------------- light and camera ----------------
const tgt = V === 1 ? new THREE.Vector3(0.45, 0.3, -1.5) : new THREE.Vector3(1.0, 0.8, -1.8);
const cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 120); const d = V === 1 ? 19.5 : 16.5, el = (V === 1 ? 50 : 11) * Math.PI / 180, az = -22 * Math.PI / 180;
cam.position.set(tgt.x + d * Math.cos(el) * Math.sin(az), tgt.y + d * Math.sin(el), tgt.z + d * Math.cos(el) * Math.cos(az)); cam.lookAt(tgt); cam.setViewOffset(W, H, 0, V === 1 ? 40 : 60, W, H); cam.updateProjectionMatrix();

if (V === 2) {scene.background = tex(16, 256, (g, w, h) => {const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#6f5fd0'); gr.addColorStop(0.55, '#c6b8f4'); gr.addColorStop(1, '#ffe2cf'); g.fillStyle = gr; g.fillRect(0, 0, w, h);});
