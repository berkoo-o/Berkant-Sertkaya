{const p=new THREE.PointLight(0xff2030,1.4,1.6,2);p.position.set(0,NY+0.3,-0.36);gp.add(p);const p2=new THREE.PointLight(0xff5a30,1.0,1.2,2);p2.position.set(0.25,NY,-0.3);gp.add(p2);}

{const rot=new THREE.Group();rot.position.set(0,NY,0.5);rot.rotation.z=+(Q.get('rz')||-0.524);gp.add(rot);
