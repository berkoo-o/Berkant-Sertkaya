    const e0=eData.reduce((a,e)=>Math.abs(e.x)+Math.abs(e.z)<Math.abs(a.x)+Math.abs(a.z)&&e.z>0.1?e:a,eData[0]);const ex=e0.x+amp*Math.sin(t*f*Math.PI*2+e0.ph);hiE.visible=t<48.4;hiE.position.set(ex,e0.y,e0.z);
    const ew=cardPos(wire,[ex,e0.y,e0.z]);tag(0,'Elektron',[ew[0]+0.55,ew[1]+0.2,ew[2]],win(t,41.6,48.3));tag(1,'Windrad',cardPos(wire,[-2.7,0.9,0]),win(t,42.3,45.0));tag(2,'dein Haus',cardPos(wire,[2.6,-0.9,0]),win(t,42.3,45.0));}
  else if(n==='lights'||n==='outro'){show('town');
    if(n==='lights'){const k=ease(u);setCam(L3([-5.2,2.0,4.4],[-4.8,2.3,3.7],k),L3([0.0,3.0,-2.4],[0.1,3.2,-2.3],k),30);}else camOutro(t-O);
    setMoon([0,1,-2]);
    const mode=t<52.3?'blink':(t<55.75?'off':'blink');lightsOn(mode,t);
    if(t>55.75&&t<57.0){turbines.forEach(o=>{const v=blinkOn(t);const on=clamp((t-55.75-Math.abs(o.T.position.x+3)*0.07)/0.1,0,1);o.lamp.visible=on*v>0.02;o.hl.material.opacity=on*v;});}
    if(n==='lights'){const pk=(t-53.6)/4.6;if(pk>0){plane.visible=true;const p=L3([-7.0,3.9,-6.4],[3.4,4.1,-0.9],pk);plane.position.set(...p);plane.rotation.set(0,-Math.atan2(5.5,10.4),0.05);}}

  [pulse,...pulses].forEach(g=>{if(!g.visible)return;g.getWorldPosition(tv);const d=tv.distanceTo(cp);g.scale.setScalar(clamp(d*0.12,0.18,1.0));});
  // overlay
  const s=SUBS.find(o=>t>=o[0]&&t<o[1]);subEl.textContent=s?s[2]:'';subEl.style.opacity=s?Math.min(1,(t-s[0])/0.15+0.2)*clamp((O+0.3-t)/0.3,0,1):0;
  const nm=NUMS.find(o=>t>=o[0]&&t<o[1]);
  if(nm){let txt=nm[2];if(txt==='29.000')txt=(Math.round(29000*eo((t-7.0)/1.8)/100)*100).toLocaleString('de-DE');
    if(txt==='380.000 V')txt=(Math.round(380000*eo((t-19.9)/1.4)/1000)*1000).toLocaleString('de-DE')+' V';
    if(txt==='STEP'){const st=['380.000 V','110.000 V','20.000 V','400 V'];txt=st[clamp(Math.floor((t-31.7)/0.8),0,3)];}
    if(txt==='50 Hz'&&t<45.6)txt='50 Hz';
    numEl.innerHTML=txt+'<small>'+nm[3]+'</small>';const op=Math.min(clamp((t-nm[0])/0.3,0,1),clamp((nm[1]-t)/0.25,0,1));numEl.style.opacity=op;srcEl.textContent=nm[4];srcEl.style.opacity=op;}
  else{numEl.style.opacity=0;srcEl.style.opacity=0;}
  logoEl.style.opacity=1-eo((t-O)/0.3);
  return si;
}

// =================================================================== OUTRO overlay: the plane switches the red lights on, they write the logo, the hero light becomes the dot
const oc=document.getElementById('oc').getContext('2d');let LAY=null,DOTS=null;
function makeLayout(){camOutro(1.9,ocam);const hp=proj(...HT,ocam);
  let sz=170;oc.font=`500 ${sz}px Poppins`;const all='function.'.split('');const ws=all.map(c=>oc.measureText(c).width);const tr=-0.04*sz;
  const m=oc.measureText('.');const xs=[];let x=0;all.forEach((c,i)=>{xs.push(x);x+=ws[i]+tr;});
  const dOff=xs[8]+(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2,dAsc=(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  let sc=Math.min(1,(hp[0]-70)/dOff);sz*=sc;const X0=hp[0]-dOff*sc,base=hp[1]+dAsc*sc;
  const L={sz,xs:xs.map(v=>X0+v*sc),base,dcx:hp[0],dcy:hp[1],dr:(m.actualBoundingBoxRight+m.actualBoundingBoxLeft)/2*sc};
  // dot-matrix of the word
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.font=`500 ${L.sz}px Poppins`;g.fillStyle='#fff';'function'.split('').forEach((ch,i)=>g.fillText(ch,L.xs[i],L.base));
  const d=g.getImageData(0,0,W,H).data;const P=[];const step=Math.max(7,Math.round(L.sz*0.06));for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){if(d[(y*W+x)*4+3]>140)P.push([x,y]);}
  return [L,P];}
function drawOutro(t){oc.clearRect(0,0,W,H);const o=t-O;if(o<0)return;if(!LAY)[LAY,DOTS]=makeLayout();
  const va=eo(o/0.8);const g=oc.createRadialGradient(W/2,LAY.base-60,120,W/2,LAY.base-60,1200);g.addColorStop(0,'rgba(4,6,12,0)');g.addColorStop(1,`rgba(4,6,12,${0.55*va})`);oc.fillStyle=g;oc.fillRect(0,0,W,H);
  // plane sweep across the word (screen space -> 3D for the plane)
  const sw=clamp((o-0.45)/1.25,0,1);const px=lerp(-80,LAY.dcx+120,sw);
  if(o>0.3&&o<2.2){const py=LAY.base-LAY.sz*1.25;V.set(px/W*2-1,-(py/H*2-1),0.5).unproject(cam);const dir=V.sub(cam.position).normalize();const P=cam.position.clone().addScaledVector(dir,12);plane.visible=true;plane.position.copy(P);plane.scale.setScalar(0.75);
    const V2=new THREE.Vector3((px+40)/W*2-1,-(py/H*2-1),0.5).unproject(cam).sub(cam.position).normalize();const P2=cam.position.clone().addScaledVector(V2,12);plane.lookAt(P2);plane.rotateY(-Math.PI/2);}
  const solid=eo((o-1.75)/0.45);
  if(solid<1){DOTS.forEach(([x,y])=>{const a=clamp((px-x)/40,0,1);if(a<=0)return;const fl=Math.max(0,1-(px-x)/220);oc.globalAlpha=(1-solid)*a;oc.fillStyle='#E01E2B';oc.shadowColor='rgba(224,30,43,.9)';oc.shadowBlur=10+18*fl;oc.beginPath();oc.arc(x,y,LAY.sz*0.024*(1+0.6*fl),0,7);oc.fill();});oc.globalAlpha=1;oc.shadowBlur=0;}
  if(solid>0){oc.save();oc.globalAlpha=solid;oc.filter=`blur(${(1-solid)*6}px)`;oc.font=`500 ${LAY.sz}px Poppins`;oc.fillStyle='#E01E2B';oc.shadowColor='rgba(224,30,43,.45)';oc.shadowBlur=18;'function'.split('').forEach((c,i)=>oc.fillText(c,LAY.xs[i],LAY.base));oc.restore();}
  // hero light becomes the dot
  const hp=proj(...HT);const d=eo((o-1.55)/0.35);
  if(d>0){oc.save();oc.fillStyle='#E01E2B';oc.shadowColor='rgba(224,30,43,.95)';oc.shadowBlur=lerp(40,14,d);oc.beginPath();oc.arc(lerp(hp[0],LAY.dcx,d),lerp(hp[1],LAY.dcy,d),LAY.dr*(0.4+0.6*d)*(1+0.25*(1-eo((o-1.9)/0.3))),0,7);oc.fill();oc.restore();
    const rr=(o-1.9)/0.85;if(rr>0&&rr<1){oc.save();oc.strokeStyle=`rgba(224,30,43,${0.75*(1-rr)})`;oc.lineWidth=lerp(6,1,rr);oc.beginPath();oc.arc(LAY.dcx,LAY.dcy,LAY.dr+190*eo(rr),0,7);oc.stroke();oc.restore();}}
}

// =================================================================== render
window.TOTAL=Math.round(END*30);
window.renderAt=async(f)=>{const t=f/30;const si=setTime(t);if(SHOTS[si].n==='outro'){drawOutro(t);}else oc.clearRect(0,0,W,H);
  composer.render();
  const sh=SHOTS[si];const d=Math.min(si===0?clamp(t/0.35,0,1):clamp((t-sh.t0)/0.16,0,1),si===SHOTS.length-1?clamp((END-t)/0.25,0,1):clamp((sh.t1-t)/0.16,0,1));
  document.body.style.filter=d<1?`brightness(${0.2+0.8*d})`:'none';return true;};
window.setT=t=>window.renderAt(Math.round(t*30));
